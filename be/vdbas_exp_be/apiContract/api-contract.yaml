openapi: 3.0.3
info:
  title: EXP OPEX Dossier Management API
  description: >-
    API contract for module **EXP.OPEX.DOSSIER** — Quản lý hồ sơ chi thường xuyên
    (Operational Expenditure Dossier Management). Covers full CRUD, draft save,
    Maker–Checker–Approver workflow, documents (chứng từ), attachments, approval &
    audit logs, export and LOV lookups. Generated from DOSSIER.sql DDL and
    EXP_OPEX_DOSSIER_CRUD_spec_function_0602.md (SRS v0.2).
  version: 0.2.0
  contact:
    name: VDBAS EXP Team
servers:
  - url: /api/v1
    description: Base path
security:
  - bearerAuth: []
tags:
  - name: Dossiers
    description: CRUD + draft for OPEX dossiers (EXP.OPEX.DOSSIER)
  - name: Workflow
    description: State-machine transitions (submit/check/approve/reject/cancel/copy)
  - name: Documents
    description: Payment documents (chứng từ) belonging to a dossier
  - name: Attachments
    description: File attachments for dossiers and documents
  - name: Audit
    description: Approval-log and audit-log history
  - name: Export
    description: List export (sync/async)
  - name: LOV
    description: List-of-value master data lookups

paths:
  ############################################################
  # DOSSIER CRUD
  ############################################################
  /exp/opex/dossiers:
    get:
      tags: [Dossiers]
      operationId: listDossiers
      summary: List OPEX dossiers (EXP.OPEX.DOSSIER.LIST.FILTER)
      description: >-
        List with filters, sorting and pagination. Default sort CREATED_DATE DESC,
        page size 20. Returns only dossiers within the caller's TREASURY scope.
      parameters:
        - name: dossierCode
          in: query
          description: Exact or starts-with match on DOSSIER_CODE
          schema: { type: string, maxLength: 100 }
        - name: fromDate
          in: query
          description: Filter start date (applies to dateField)
          schema: { type: string, format: date }
        - name: toDate
          in: query
          description: Filter end date; must be >= fromDate
          schema: { type: string, format: date }
        - name: dateField
          in: query
          description: Which date the from/to range applies to (LOV.02)
          schema:
            type: string
            enum: [CREATED_DATE, RECEIVED_DATE, CHECKED_DATE, APPROVED_DATE]
        - name: fStatus
          in: query
          description: Filter by one or more dossier statuses
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/DossierStatus' }
        - name: dataSourceCode
          in: query
          description: Source filter (LOV.04 - /lov/data-sources)
          schema: { type: string, maxLength: 100 }
        - name: createdBy
          in: query
          description: Maker user code (LOOKUP.USER)
          schema: { type: string, maxLength: 100 }
        - name: checkedBy
          in: query
          description: Checker user code (LOOKUP.USER)
          schema: { type: string, maxLength: 100 }
        - name: approvedBy
          in: query
          description: Approver user code (LOOKUP.USER)
          schema: { type: string, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, enum: [20, 50, 100, 200], default: 20 }
        - name: sort
          in: query
          description: 'Sort expression, e.g. createdDate,desc'
          schema: { type: string, default: 'createdDate,desc' }
      responses:
        '200':
          description: Paged list of dossiers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Dossiers]
      operationId: createDossier
      summary: Create dossier with full validation (EXP.OPEX.DOSSIER.NEW.SAVE)
      description: >-
        Full validation (VAL-01..VAL-11), saves in DRAFT state, generates
        DOSSIER_CODE. Only Maker role. CREATED_BY/SEND_DATE auto-filled.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DossierCreateRequest' }
      responses:
        '201':
          description: Created (MSG-OK-SAVE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierCreateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /exp/opex/dossiers/drafts:
    post:
      tags: [Dossiers]
      operationId: saveDossierDraft
      summary: Save draft with minimal validation (EXP.OPEX.DOSSIER.NEW.SAVE / A1)
      description: >-
        Save-draft (Lưu nháp). Skips full business validation, only format checks
        (VAL-02). Saves DRAFT and generates DOSSIER_CODE if not present.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DossierDraftRequest' }
      responses:
        '201':
          description: Draft saved (MSG-OK-SAVE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierCreateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /exp/opex/dossiers/{id}:
    get:
      tags: [Dossiers]
      operationId: getDossier
      summary: Get dossier detail (EXP.OPEX.DOSSIER.VIEW.OPEN)
      parameters:
        - $ref: '#/components/parameters/DossierId'
      responses:
        '200':
          description: Dossier detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Dossiers]
      operationId: updateDossier
      summary: Update dossier (EXP.OPEX.DOSSIER.EDIT.SAVE)
      description: >-
        Editable only when F_STATUS in {DRAFT, REJECTED_BY_CHECKER} (VAL-13) and
        caller is the original Maker (VAL-14). Requires version for optimistic
        lock (VAL-15); on success F-VER+1. SOURCE/dossierTypeCode are immutable
        (VAL-17) and not accepted here.
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DossierUpdateRequest' }
      responses:
        '200':
          description: Updated (MSG-OK-SAVE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierUpdateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Dossiers]
      operationId: deleteDossier
      summary: Soft-delete dossier (EXP.OPEX.DOSSIER.DELETE.CONFIRM)
      description: >-
        Soft-delete (F_STATUS=DELETED). Allowed only in {DRAFT, REJECTED_BY_CHECKER}
        by the original Maker. Requires deleteReason (>=10 chars, VAL-16) and
        confirmReviewed=true. Record stays retrievable via audit (BIZ-003).
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteDossierRequest' }
      responses:
        '200':
          description: Deleted (MSG-OK-DELETE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /exp/opex/dossiers/{id}/copy:
    post:
      tags: [Workflow]
      operationId: copyDossier
      summary: Copy dossier as new draft (EXP.OPEX.DOSSIER.NEW.COPY)
      description: Duplicate an existing dossier into a new DRAFT; new DOSSIER_CODE on save.
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: New draft created from copy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierCreateResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  ############################################################
  # WORKFLOW TRANSITIONS
  ############################################################
  /exp/opex/dossiers/{id}/submit:
    post:
      tags: [Workflow]
      operationId: submitDossier
      summary: Submit for control (EXP.OPEX.DOSSIER.NEW.SUBMIT)
      description: >-
        DRAFT/REJECTED_BY_CHECKER -> PENDING_CHECKER. Pre-conditions: full
        validation passes and at least one valid document exists. Computes
        HASH_INFO, notifies Checker (BIZ-009).
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Submitted (MSG-OK-SUBMIT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowActionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /exp/opex/dossiers/{id}/check:
    post:
      tags: [Workflow]
      operationId: checkDossier
      summary: Checker approves control (EXP.OPEX.DOSSIER.APPROVE.CHECKER)
      description: >-
        PENDING_CHECKER -> CHECKED (then APPROVAL_PENDING when an Approver exists).
        SoD enforced (BIZ-001): checker must differ in user and role from Maker.
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveRequest' }
      responses:
        '200':
          description: Checked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowActionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /exp/opex/dossiers/{id}/check-reject:
    post:
      tags: [Workflow]
      operationId: rejectByChecker
      summary: Checker rejects (EXP.OPEX.DOSSIER.CHECK.REJECT)
      description: 'PENDING_CHECKER -> CHECK_REJECTED. Reason mandatory (>=10, <=500); notifies Maker.'
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200':
          description: Rejected by checker (MSG-INF-NOTIFY-CHECK_REJ)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /exp/opex/dossiers/{id}/check-return:
    post:
      tags: [Workflow]
      operationId: returnByChecker
      summary: Checker returns to Maker (EXP.OPEX.DOSSIER.CHECK.CANCEL)
      description: 'PENDING_CHECKER -> DRAFT. Reason mandatory; notifies Maker.'
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200':
          description: Returned to maker
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /exp/opex/dossiers/{id}/approve:
    post:
      tags: [Workflow]
      operationId: approveDossier
      summary: Approver approves (EXP.OPEX.DOSSIER.APPROVE.APPROVER)
      description: >-
        CHECKED/APPROVAL_PENDING -> APPROVED. SoD enforced (BIZ-001). Triggers
        downstream accounting/payment flow; notifies Maker. Optional digital sign.
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveRequest' }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowActionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /exp/opex/dossiers/{id}/approve-reject:
    post:
      tags: [Workflow]
      operationId: rejectByApprover
      summary: Approver rejects (EXP.OPEX.DOSSIER.APPROVE.REJECT)
      description: 'CHECKED -> APPROVAL_REJECTED. Reason mandatory; notifies Checker.'
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200':
          description: Rejected by approver (MSG-INF-NOTIFY-APPROVAL_REJ)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /exp/opex/dossiers/{id}/approve-cancel:
    post:
      tags: [Workflow]
      operationId: cancelApproval
      summary: Approver cancels back to Checker (EXP.OPEX.DOSSIER.APPROVE.CANCEL)
      description: 'APPROVAL_PENDING -> CHECKED. Reason mandatory; notifies Checker.'
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200':
          description: Approval cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  ############################################################
  # DOCUMENTS (chứng từ)
  ############################################################
  /exp/opex/dossiers/{id}/documents:
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: List documents of a dossier (B1.2 grid)
      parameters:
        - $ref: '#/components/parameters/DossierId'
      responses:
        '200':
          description: Documents in the dossier
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Documents]
      operationId: addDocument
      summary: Add document to dossier (EXP.OPEX.DOSSIER.DOC.ADD)
      description: >-
        Adds a payment document. DOCUMENT_NO is generated
        ([dossierCode]-[documentTypeCode]-[#### from 0001]); DOCUMENT_NAME is
        auto-filled from the selected document type (LOV.03).
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentCreateRequest' }
      responses:
        '201':
          description: Document added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /exp/opex/dossiers/{id}/documents/{docId}:
    get:
      tags: [Documents]
      operationId: getDocument
      summary: Get document detail (EXP.OPEX.DOSSIER.DOC.VIEW)
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/DocId'
      responses:
        '200':
          description: Document detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Documents]
      operationId: updateDocument
      summary: Update document (EXP.OPEX.DOSSIER.DOC.EDIT)
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/DocId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentUpdateRequest' }
      responses:
        '200':
          description: Document updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Delete document (EXP.OPEX.DOSSIER.DOC.DELETE)
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/DocId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Document deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  ############################################################
  # ATTACHMENTS - dossier level
  ############################################################
  /exp/opex/dossiers/{id}/attachments:
    get:
      tags: [Attachments]
      operationId: listDossierAttachments
      summary: List dossier attachments
      parameters:
        - $ref: '#/components/parameters/DossierId'
      responses:
        '200':
          description: Attachments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attachment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Attachments]
      operationId: uploadDossierAttachment
      summary: Upload dossier attachment (EXP.OPEX.DOSSIER.ATTACH.UPLOAD)
      description: >-
        Upload a file (VAL-09): <=10MB, format pdf/jpg/png/docx, virus-scanned.
        Duplicate name+size is warned (VAL-20).
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/AttachmentUploadRequest' }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File too large (>10MB, VAL-09 / MSG-ERR-FILE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: Unsupported file format (VAL-09 / MSG-ERR-FILE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /exp/opex/dossiers/{id}/attachments/{attId}:
    get:
      tags: [Attachments]
      operationId: downloadDossierAttachment
      summary: Download dossier attachment (EXP.OPEX.DOSSIER.ATTACH.DOWNLOAD)
      description: Returns the binary file; access is audited.
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/AttId'
      responses:
        '200':
          description: Binary file content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Attachments]
      operationId: deleteDossierAttachment
      summary: Delete dossier attachment (EXP.OPEX.DOSSIER.ATTACH.DELETE)
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/AttId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Attachment deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  ############################################################
  # ATTACHMENTS - document level
  ############################################################
  /exp/opex/dossiers/{id}/documents/{docId}/attachments:
    get:
      tags: [Attachments]
      operationId: listDocumentAttachments
      summary: List document attachments
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/DocId'
      responses:
        '200':
          description: Attachments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attachment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Attachments]
      operationId: uploadDocumentAttachment
      summary: Upload document attachment
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/DocId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/AttachmentUploadRequest' }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File too large (VAL-09)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: Unsupported file format (VAL-09)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /exp/opex/dossiers/{id}/documents/{docId}/attachments/{attId}:
    get:
      tags: [Attachments]
      operationId: downloadDocumentAttachment
      summary: Download document attachment
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/DocId'
        - $ref: '#/components/parameters/AttId'
      responses:
        '200':
          description: Binary file content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Attachments]
      operationId: deleteDocumentAttachment
      summary: Delete document attachment
      parameters:
        - $ref: '#/components/parameters/DossierId'
        - $ref: '#/components/parameters/DocId'
        - $ref: '#/components/parameters/AttId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Attachment deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  ############################################################
  # AUDIT
  ############################################################
  /exp/opex/dossiers/{id}/approval-log:
    get:
      tags: [Audit]
      operationId: getApprovalLog
      summary: Approval workflow history (EXP.OPEX.DOSSIER.VIEW.APPROVAL)
      parameters:
        - $ref: '#/components/parameters/DossierId'
      responses:
        '200':
          description: Approval log entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApprovalLogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /exp/opex/dossiers/{id}/audit-log:
    get:
      tags: [Audit]
      operationId: getAuditLog
      summary: Field change history (EXP.OPEX.DOSSIER.VIEW.HISTORY)
      description: 'Audit entries with oldValue->newValue (BIZ-007).'
      parameters:
        - $ref: '#/components/parameters/DossierId'
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditLogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  ############################################################
  # EXPORT
  ############################################################
  /exp/opex/dossiers/export:
    get:
      tags: [Export]
      operationId: exportDossiers
      summary: Export dossier list (EXP.OPEX.DOSSIER.LIST.EXPORT)
      description: >-
        Sync export (<50k rows -> file is returned directly); async (>=50k ->
        returns a jobId + polling URL). Same filters as listDossiers.
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [EXCEL, PDF, CSV] }
        - name: dossierCode
          in: query
          schema: { type: string }
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
        - name: fStatus
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/DossierStatus' }
      responses:
        '200':
          description: Synchronous export file (<50k rows)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '202':
          description: Asynchronous export accepted (>=50k rows)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /exp/opex/dossiers/export/{jobId}:
    get:
      tags: [Export]
      operationId: getExportJob
      summary: Poll async export job status
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Export job status (with download URL when COMPLETED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  ############################################################
  # LOV
  ############################################################
  /lov/organizations:
    get:
      tags: [LOV]
      operationId: lovOrganizations
      summary: LOV - Đơn vị quan hệ ngân sách (GL_SEGMENT6, LOV.07.6)
      parameters:
        - $ref: '#/components/parameters/LovSearch'
        - $ref: '#/components/parameters/LovPage'
        - $ref: '#/components/parameters/LovSize'
      responses:
        '200':
          description: Active organizations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LovListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lov/treasuries:
    get:
      tags: [LOV]
      operationId: lovTreasuries
      summary: LOV - Kho bạc (LOV.07.11)
      parameters:
        - $ref: '#/components/parameters/LovSearch'
        - $ref: '#/components/parameters/LovPage'
        - $ref: '#/components/parameters/LovSize'
      responses:
        '200':
          description: Active treasuries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LovListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lov/data-sources:
    get:
      tags: [LOV]
      operationId: lovDataSources
      summary: LOV - Nguồn (LOV.04 - MANUAL/DVKB/AUTO)
      parameters:
        - $ref: '#/components/parameters/LovSearch'
      responses:
        '200':
          description: Active data sources
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LovListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lov/dossier-types:
    get:
      tags: [LOV]
      operationId: lovDossierTypes
      summary: LOV - Loại hồ sơ (CAPEX/OPEX)
      parameters:
        - $ref: '#/components/parameters/LovSearch'
      responses:
        '200':
          description: Active dossier types
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LovListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lov/document-types:
    get:
      tags: [LOV]
      operationId: lovDocumentTypes
      summary: LOV - Loại chứng từ (LOV.03 Expenditure_doc_type)
      parameters:
        - $ref: '#/components/parameters/LovSearch'
        - $ref: '#/components/parameters/LovPage'
        - $ref: '#/components/parameters/LovSize'
      responses:
        '200':
          description: Active document types
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LovListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lov/attachment-types:
    get:
      tags: [LOV]
      operationId: lovAttachmentTypes
      summary: LOV - Loại đính kèm
      parameters:
        - $ref: '#/components/parameters/LovSearch'
      responses:
        '200':
          description: Active attachment types
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LovListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lov/currencies:
    get:
      tags: [LOV]
      operationId: lovCurrencies
      summary: LOV - Loại tiền (LOV.01)
      description: >-
        Currency list (VND/USD). NOTE: currency is not stored in the current
        DDL (EXP_DOCUMENT has no CURRENCY_CODE column) - provided per SRS only.
      parameters:
        - $ref: '#/components/parameters/LovSearch'
      responses:
        '200':
          description: Active currencies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LovListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lov/users:
    get:
      tags: [LOV]
      operationId: lovUsers
      summary: LOV - Người dùng (EXP.OPEX.DOSSIER.LOOKUP.USER)
      description: >-
        User directory lookup for Maker/Checker/Approver filters. Backed by the
        identity provider, not by a table in this schema.
      parameters:
        - $ref: '#/components/parameters/LovSearch'
        - name: activeStatus
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, ALL], default: ACTIVE }
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LovListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT bearer with claims: userId, role (MAKER/CHECKER/APPROVER/VIEWER), treasuryCode scope.'

  parameters:
    DossierId:
      name: id
      in: path
      required: true
      description: Dossier UUID (EXP_DOSSIER.ID)
      schema: { type: string, format: uuid }
    DocId:
      name: docId
      in: path
      required: true
      description: Document UUID (EXP_DOCUMENT.ID)
      schema: { type: string, format: uuid }
    AttId:
      name: attId
      in: path
      required: true
      description: Attachment UUID
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID to prevent double-submit on mutating calls.
      schema: { type: string, format: uuid }
    LovSearch:
      name: search
      in: query
      required: false
      description: Free-text search on code/name (Vietnamese accent-insensitive).
      schema: { type: string }
    LovPage:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    LovSize:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }

  responses:
    BadRequest:
      description: Validation/format error (VAL-01/02/03 - MSG-ERR-REQUIRED/FORMAT/LOOKUP)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: MSG-ERR-REQUIRED
            message: 'Vui lòng nhập [Mã ĐVSDNS]'
            traceId: '3b1e...'
    Unauthorized:
      description: Missing/expired session (MSG-ERR-SESSION)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: MSG-ERR-SESSION
            message: 'Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại'
    Forbidden:
      description: Insufficient permission / SoD or ownership violation (MSG-ERR-PERMISSION/MAKER)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: MSG-ERR-MAKER
            message: 'Chỉ Người lập gốc mới được phép Sửa/Xoá'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Optimistic lock / state conflict (VAL-15/VAL-13 - MSG-ERR-LOCK/STATUS)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: MSG-ERR-LOCK
            message: 'Bản ghi đã bị thay đổi từ phiên khác. Vui lòng tải lại trước khi tiếp tục'
    UnprocessableEntity:
      description: Business-rule violation (VAL-07/12/16/21 - MSG-ERR-AMOUNT-MISMATCH/...)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: MSG-ERR-AMOUNT-MISMATCH
            message: 'Tổng số tiền dòng chứng từ không khớp với tổng hồ sơ'

  schemas:
    ############### ENUMS ###############
    DossierStatus:
      type: string
      description: OPEX_DOSSIER_STATUS state machine (A11)
      enum:
        - DRAFT
        - PENDING_CHECKER
        - CHECKED
        - APPROVAL_PENDING
        - APPROVED
        - APPROVAL_REJECTED
        - CHECK_REJECTED
        - CHECK_CANCELLED
        - APPROVAL_CANCELLED
        - REJECTED_BY_CHECKER
        - DELETED
    ActionRole:
      type: string
      enum: [MAKER, CHECKER, APPROVER]
    DossierType:
      type: string
      enum: [OPEX, CAPEX]
      default: OPEX

    ############### REQUESTS ###############
    DossierCreateRequest:
      type: object
      description: Create OPEX dossier (full validation). Project fields not used for OPEX.
      required: [organizationCode, treasuryCode, sendDate, dataSourceCode]
      properties:
        organizationCode:
          type: string
          maxLength: 100
          description: 'GL_SEGMENT6. Select from /lov/organizations'
        treasuryCode:
          type: string
          maxLength: 100
          description: 'Select from /lov/treasuries'
        dossierTypeCode:
          allOf:
            - $ref: '#/components/schemas/DossierType'
          description: 'Fixed OPEX for this module; immutable after create (VAL-17)'
        dataSourceCode:
          type: string
          maxLength: 100
          description: 'SOURCE. Select from /lov/data-sources. Read-only after first save (VAL-17)'
        sendDate:
          type: string
          format: date
          description: Ngày gửi hồ sơ; default current date
    DossierDraftRequest:
      type: object
      description: Save-draft (minimal validation); all fields optional.
      properties:
        organizationCode: { type: string, maxLength: 100, description: 'Select from /lov/organizations' }
        treasuryCode: { type: string, maxLength: 100, description: 'Select from /lov/treasuries' }
        dossierTypeCode: { $ref: '#/components/schemas/DossierType' }
        dataSourceCode: { type: string, maxLength: 100, description: 'Select from /lov/data-sources' }
        sendDate: { type: string, format: date }
    DossierUpdateRequest:
      type: object
      description: 'Update dossier; version required (VAL-15). SOURCE & dossierTypeCode immutable (VAL-17).'
      required: [version, organizationCode, treasuryCode, sendDate]
      properties:
        version:
          type: integer
          description: Current F-VER for optimistic lock (VAL-15)
        organizationCode: { type: string, maxLength: 100, description: 'Select from /lov/organizations' }
        treasuryCode: { type: string, maxLength: 100, description: 'Select from /lov/treasuries' }
        sendDate: { type: string, format: date }
    DeleteDossierRequest:
      type: object
      required: [deleteReason, confirmReviewed]
      properties:
        deleteReason:
          type: string
          minLength: 10
          maxLength: 500
          description: Lý do xoá (VAL-16, BIZ-006)
        confirmReviewed:
          type: boolean
          description: Tick xác nhận đã rà soát (VAL-16)
    ApproveRequest:
      type: object
      description: Optional note + optional digital signature for check/approve.
      properties:
        reason:
          type: string
          maxLength: 500
        digitalSign:
          type: object
          description: 'Optional digital signature payload (EXP_DIGITAL_SIGNED)'
          properties:
            signedContent: { type: string, description: 'JSON: documentHash/signerHash/algorithm' }
            signature: { type: string }
            cert: { type: string }
    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Lý do từ chối/huỷ (BIZ-006)
    DocumentCreateRequest:
      type: object
      description: Add a payment document. documentNo & documentName are backend-generated.
      required: [documentTypeCode, treasuryCode, documentDate, accountingDate, originalAmount, baseAmount]
      properties:
        documentTypeCode:
          type: string
          maxLength: 100
          description: 'Select from /lov/document-types (LOV.03)'
        treasuryCode:
          type: string
          maxLength: 100
          description: 'Select from /lov/treasuries'
        documentDate: { type: string, format: date }
        accountingDate: { type: string, format: date, description: 'POSTING_DATE' }
        originalAmount:
          type: integer
          description: 'Số tiền nguyên tệ (#,##0)'
        baseAmount:
          type: integer
          description: 'Số tiền VND (#,##0)'
        currencyCode:
          type: string
          maxLength: 10
          description: >-
            Loại tiền (LOV.01 - /lov/currencies). VERIFY: not persisted in current
            DDL (EXP_DOCUMENT has no CURRENCY_CODE column).
    DocumentUpdateRequest:
      type: object
      required: [documentTypeCode, treasuryCode, documentDate, accountingDate, originalAmount, baseAmount]
      properties:
        documentTypeCode: { type: string, maxLength: 100, description: 'Select from /lov/document-types' }
        treasuryCode: { type: string, maxLength: 100, description: 'Select from /lov/treasuries' }
        documentDate: { type: string, format: date }
        accountingDate: { type: string, format: date }
        originalAmount: { type: integer, description: 'Số tiền nguyên tệ (#,##0)' }
        baseAmount: { type: integer, description: 'Số tiền VND (#,##0)' }
        currencyCode: { type: string, maxLength: 10, description: 'VERIFY: not in DDL' }
    AttachmentUploadRequest:
      type: object
      required: [file, attachmentTypeCode]
      properties:
        file:
          type: string
          format: binary
          description: 'File <=10MB; pdf/jpg/png/docx (VAL-09)'
        attachmentTypeCode:
          type: string
          maxLength: 100
          description: 'Select from /lov/attachment-types'
        description:
          type: string
          maxLength: 250
          nullable: true

    ############### RESPONSES ###############
    DossierSummary:
      type: object
      description: Row in the LIST grid (B2.2)
      properties:
        id: { type: string, format: uuid }
        treasuryCode: { type: string }
        treasuryName: { type: string, description: 'Auto-filled from treasuryCode via COMMON_TREASURY; read-only' }
        dossierCode: { type: string }
        sendDate: { type: string, format: date }
        dataSourceCode: { type: string, description: 'SOURCE' }
        fStatus: { $ref: '#/components/schemas/DossierStatus' }
        createdBy: { type: string }
        createdDate: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedDate: { type: string, format: date-time }
    DossierDetail:
      type: object
      description: Full dossier detail incl. child collections
      properties:
        id: { type: string, format: uuid }
        treasuryCode: { type: string }
        treasuryName: { type: string, description: 'Auto-filled from treasuryCode via COMMON_TREASURY; read-only' }
        dossierTypeCode: { $ref: '#/components/schemas/DossierType' }
        dossierCode: { type: string, description: 'Backend generated; read-only (VAL-17)' }
        version: { type: integer, description: 'F-VER (optimistic lock)' }
        sendDate: { type: string, format: date }
        projectCode: { type: string, nullable: true, description: 'CAPEX only; null for OPEX' }
        projectName: { type: string, nullable: true, description: 'Auto-filled from projectCode via EXP_PROJECT; read-only' }
        projectSpecificCode: { type: string, nullable: true, description: 'CAPEX only; null for OPEX' }
        projectSpecificName: { type: string, nullable: true, description: 'Auto-filled from projectSpecificCode; read-only' }
        organizationCode: { type: string, description: 'GL_SEGMENT6' }
        organizationName: { type: string, description: 'Auto-filled from organizationCode via COMMON_ORGANIZATION; read-only' }
        status: { type: integer, enum: [0, 1], description: 'Hiệu lực; managed by backend; read-only' }
        fStatus: { $ref: '#/components/schemas/DossierStatus' }
        workflowCode: { type: string, description: 'Managed by backend; read-only' }
        dataSourceCode: { type: string, description: 'SOURCE; read-only after first save' }
        assignUser: { type: string, description: 'Managed by backend; read-only' }
        sla: { type: string, format: date-time, description: 'Managed by backend; read-only' }
        hashInfo: { type: string, nullable: true, description: 'Set on submit; managed by backend; read-only' }
        completedDate: { type: string, format: date, nullable: true, description: 'Managed by backend; read-only' }
        createdBy: { type: string }
        createdDate: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedDate: { type: string, format: date-time }
        documents:
          type: array
          items: { $ref: '#/components/schemas/DocumentDetail' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
    DossierListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DossierSummary' }
        pagination: { $ref: '#/components/schemas/Pagination' }
        statusCounts:
          type: object
          additionalProperties: { type: integer }
          description: 'Count per status, e.g. {"DRAFT":4,"APPROVED":9}'
    DossierCreateResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        dossierCode: { type: string }
        fStatus: { $ref: '#/components/schemas/DossierStatus' }
        version: { type: integer }
    DossierUpdateResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        dossierCode: { type: string }
        fStatus: { $ref: '#/components/schemas/DossierStatus' }
        version: { type: integer, description: 'New F-VER after +1' }
    WorkflowActionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        fStatus: { $ref: '#/components/schemas/DossierStatus' }
        fStatusName: { type: string, description: 'Display label of fStatus (COMMON_STATUS)' }
        assignUser: { type: string }
    DocumentDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        dossierId: { type: string, format: uuid }
        treasuryCode: { type: string }
        treasuryName: { type: string, description: 'Auto-filled from treasuryCode; read-only' }
        documentTypeCode: { type: string }
        documentName: { type: string, description: 'Auto-filled from documentTypeCode (LOV.03); read-only' }
        documentNo: { type: string, description: 'Backend generated [code]-[type]-[####]; read-only' }
        documentDate: { type: string, format: date }
        accountingDate: { type: string, format: date }
        originalAmount: { type: integer, description: 'Số tiền nguyên tệ (#,##0)' }
        baseAmount: { type: integer, description: 'Số tiền VND (#,##0)' }
        status: { type: integer, enum: [0, 1], description: 'Managed by backend; read-only' }
        createdBy: { type: string }
        createdDate: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedDate: { type: string, format: date-time }
    Attachment:
      type: object
      description: 'Attachment metadata (FILE_PATH is internal and never exposed)'
      properties:
        id: { type: string, format: uuid }
        attachmentTypeCode: { type: string }
        fileName: { type: string, description: 'Derived from upload; read-only' }
        fileType: { type: string, description: 'Derived from upload; read-only' }
        fileSize: { type: number, description: 'Bytes; derived; read-only' }
