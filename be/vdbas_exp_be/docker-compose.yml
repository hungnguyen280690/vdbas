x-common-env: &common-env
  SERVER_PORT: 8080
  DB_HOST: ${DB_HOST:-172.16.5.20}
  DB_PORT: ${DB_PORT:-1521}
  DB_NAME: ${DB_NAME:-vdbaspdb}
  DB_USER: ${DB_USER:-vdbas_exp}
  DB_PASSWORD: ${DB_PASSWORD:-vdbas_exp}
  DB_DDL_AUTO: ${DB_DDL_AUTO:-update}
  DB_SHOW_SQL: ${DB_SHOW_SQL:-true}
  CACHE_TYPE: ${CACHE_TYPE:-memory}
  GATEWAY_INTERNAL_TOKEN:
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
  SWAGGER_ENABLED: "true"
  LOG_LEVEL_APP: DEBUG
  LOG_LEVEL_SQL: INFO
  JAVA_OPTS: -Xms512m -Xmx1g -XX:+UseG1GC

services:
  api:
    build:
      context: ..
      dockerfile: vdbas_exp_be/Dockerfile
      network: host
    image: vdbas-exp-be-api:latest
    container_name: vdbas-exp-api
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      <<: *common-env
    volumes:
      - api-logs:/app/logs
    networks:
      - exp-network

volumes:
  api-logs:
    driver: local

networks:
  exp-network:
    driver: bridge
