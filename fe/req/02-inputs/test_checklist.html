<style>
  :root {
    --primary: #1677FF;
    --danger: #FF4D4F;
    --warning: #FAAD14;
    --success: #52C41A;
    --border: #d9d9d9;
    --bg-page: #f5f5f5;
    --bg-card: #FFFFFF;
    --bg-header: #fafafa;
    --text-primary: #262626;
    --text-secondary: #595959;
    --font: 'Segoe UI', 'Roboto', sans-serif;
    --radius: 6px;
    --shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); font-size: 13px; background: var(--bg-page); color: var(--text-primary); }

  .page-wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }

  /* Header */
  .page-header {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 24px;
    margin-bottom: 16px; box-shadow: var(--shadow);
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .page-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .page-subtitle { font-size: 12px; color: var(--text-secondary); }

  /* Stats */
  .stats-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 16px;
    text-align: center; box-shadow: var(--shadow);
  }
  .stat-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
  .stat-num { font-size: 22px; font-weight: 700; }
  .stat-total .stat-num { color: var(--primary); }
  .stat-pos .stat-num { color: #52c41a; }
  .stat-neg .stat-num { color: var(--danger); }
  .stat-pass .stat-num { color: #52c41a; }
  .stat-fail .stat-num { color: var(--danger); }
  .stat-skip .stat-num { color: #8c8c8c; }
  .stat-pct .stat-num { color: var(--warning); }

  /* Progress bar */
  .progress-wrap { background: #f0f0f0; border-radius: 4px; height: 8px; margin-bottom: 16px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 4px; background: var(--success); transition: width .5s; }

  /* Toolbar */
  .toolbar {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 16px;
    margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap;
    box-shadow: var(--shadow); align-items: center;
  }
  .toolbar input, .toolbar select {
    height: 30px; padding: 4px 10px; border: 1px solid var(--border);
    border-radius: var(--radius); font-size: 13px; outline: none;
  }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--primary); }
  .toolbar input[type=text] { min-width: 200px; }
  .btn {
    height: 30px; padding: 4px 14px; border-radius: var(--radius);
    font-size: 13px; cursor: pointer; font-weight: 400; border: 1px solid transparent;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-default { background: #fff; color: var(--text-primary); border-color: var(--border); }
  .btn-default:hover { border-color: var(--primary); color: var(--primary); }
  .toolbar-sep { height: 20px; width: 1px; background: var(--border); }

  /* Group card */
  .group-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 12px; box-shadow: var(--shadow);
    overflow: hidden;
  }
  .group-header {
    background: var(--bg-header); padding: 10px 16px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none;
  }
  .group-title { font-weight: 600; font-size: 14px; }
  .group-stats { margin-left: auto; display: flex; gap: 8px; font-size: 12px; }

  /* TC Row */
  .tc-row {
    display: grid;
    grid-template-columns: 32px 180px 80px 1fr 1fr 1fr 140px 50px 180px;
    gap: 8px; padding: 10px 16px; align-items: start;
    border-bottom: 1px solid #f5f5f5; transition: background .15s;
  }
  .tc-row:hover { background: #fafeff; }
  .tc-row.status-pass { border-left: 3px solid var(--success); }
  .tc-row.status-fail { border-left: 3px solid var(--danger); }
  .tc-row.status-skip { border-left: 3px solid #bfbfbf; }
  .tc-row.status-pending { border-left: 3px solid #d9d9d9; }
  .tc-row.hidden { display: none; }

  .tc-id { font-size: 11px; font-weight: 600; color: var(--primary); line-height: 1.4; }
  .tc-name { font-weight: 600; font-size: 12px; line-height: 1.5; }
  .tc-type-badge {
    display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px; font-weight: 500;
  }
  .tc-positive { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
  .tc-negative { background: #fff1f0; color: var(--danger); border: 1px solid #ffa39e; }
  .tc-step { font-size: 12px; line-height: 1.5; color: var(--text-secondary); }
  .tc-step strong { color: var(--text-primary); }
  .tc-ref { font-size: 11px; color: #7c3aed; }

  /* Status radio */
  .status-radios { display: flex; flex-direction: column; gap: 4px; }
  .status-radios label { display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 12px; }
  .status-radios input[type=radio] { cursor: pointer; }

  /* Bug ID input */
  .bug-id-input {
    width: 100%; height: 28px; padding: 2px 8px;
    border: 1px solid var(--border); border-radius: 4px; font-size: 12px;
  }
  .bug-id-input:focus { outline: none; border-color: var(--primary); }

  /* Responsive */
  @media (max-width: 1100px) {
    .tc-row { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 700px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>

<script>
const DATA = JSON.parse(document.getElementById('testcases-data').textContent);
const TESTCASES = DATA.testcases;

// State: { tcId: { status:'pending'|'pass'|'fail'|'skip', bugId:'' } }
const state = {};
TESTCASES.forEach(tc => { state[tc.id] = { status: 'pending', bugId: '' }; });

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('hdr-total').textContent = TESTCASES.length;
  document.getElementById('st-total').textContent = TESTCASES.length;
  DATA.stats.total = TESTCASES.length; // ensure stats match actual count
  document.getElementById('st-pos').textContent = TESTCASES.filter(t => t.type === 'Positive').length;
  document.getElementById('st-neg').textContent = TESTCASES.filter(t => t.type === 'Negative').length;
  renderGroups();
  updateStats();
});

function renderGroups() {
  const container = document.getElementById('tc-container');
  const groups = {};
  TESTCASES.forEach(tc => {
    if (!groups[tc.group]) groups[tc.group] = { name: tc.groupName, items: [] };
    groups[tc.group].items.push(tc);
  });

  container.innerHTML = Object.entries(groups).map(([gid, g]) => {
    const tcRows = g.items.map(tc => buildRow(tc)).join('');
    return `
      <div class="group-card" id="group-${gid}">
        <div class="group-header" onclick="toggleGroup(${gid})">
          <span>📂 Nhóm ${gid} — ${g.name}</span>
          <span style="font-size:12px;color:var(--text-secondary)">${g.items.length} TC</span>
          <div class="group-stats" id="group-stats-${gid}"></div>
        </div>
        <div id="group-body-${gid}">${tcRows}</div>
      </div>`;
  }).join('');
  updateGroupStats();
}

function buildRow(tc) {
  const s = state[tc.id];
  const refs = (tc.ref || []).map(r => `<span class="tc-ref">[${r}]</span>`).join(' ');
  return `
    <div class="tc-row status-${s.status}" id="row-${tc.id}"
         data-group="${tc.group}" data-type="${tc.type}" data-status="${s.status}">
      <div class="tc-id">${tc.id.split('.TC.')[1] || tc.id}</div>
      <div>
        <div class="tc-name">${tc.name}</div>
        <span class="tc-type-badge ${tc.type === 'Positive' ? 'tc-positive' : 'tc-negative'}">${tc.type}</span>
      </div>
      <div class="tc-type-badge" style="display:none">${tc.type}</div>
      <div class="tc-step"><strong>Given:</strong><br>${tc.given}</div>
      <div class="tc-step"><strong>When:</strong><br>${tc.when}</div>
      <div class="tc-step"><strong>Then:</strong><br>${tc.then}<br><br>${refs}</div>
      <div class="status-radios" id="radios-${tc.id.replace(/\./g,'_')}">
        ${['pass','fail','skip'].map(v => `
          <label>
            <input type="radio" name="status_${tc.id.replace(/\./g,'_')}" value="${v}"
                   ${s.status===v?'checked':''} onchange="setStatus('${tc.id}','${v}')">
            ${v==='pass'?'✅ Pass':v==='fail'?'❌ Fail':'⏭ N/A'}
          </label>`).join('')}
      </div>
      <div>
        <input class="bug-id-input" type="text" placeholder="Bug ID..."
               value="${s.bugId}" data-testid="bug-id-${tc.id}"
               onchange="state['${tc.id}'].bugId=this.value">
      </div>
    </div>`;
}

function setStatus(id, val) {
  state[id].status = val;
  const row = document.getElementById(`row-${id}`);
  if (row) {
    row.className = row.className.replace(/status-\w+/, `status-${val}`);
    row.dataset.status = val;
  }
  updateStats();
  updateGroupStats();
}

function updateStats() {
  const all = TESTCASES.length;
  const pass = TESTCASES.filter(t => state[t.id].status === 'pass').length;
  const fail = TESTCASES.filter(t => state[t.id].status === 'fail').length;
  const skip = TESTCASES.filter(t => state[t.id].status === 'skip').length;
  const done = pass + fail + skip;
  document.getElementById('st-pass').textContent = pass;
  document.getElementById('st-fail').textContent = fail;
  document.getElementById('st-skip').textContent = skip;
  const pct = done > 0 ? Math.round(pass / done * 100) : 0;
  document.getElementById('st-pct').textContent = done > 0 ? `${pct}%` : '—';
  document.getElementById('progress-bar').style.width = (done / all * 100) + '%';
}

function updateGroupStats() {
  [1,2,3,4].forEach(gid => {
    const el = document.getElementById(`group-stats-${gid}`);
    if (!el) return;
    const gTCs = TESTCASES.filter(t => t.group == gid);
    const pass = gTCs.filter(t => state[t.id].status === 'pass').length;
    const fail = gTCs.filter(t => state[t.id].status === 'fail').length;
    el.innerHTML = `
      <span style="color:var(--success)">✅ ${pass}</span>
      <span style="color:var(--danger)">❌ ${fail}</span>
      <span style="color:#8c8c8c">⏭ ${gTCs.filter(t=>state[t.id].status==='skip').length}</span>`;
  });
}

function applyFilters() {
  const q = document.getElementById('filter-text').value.toLowerCase();
  const st = document.getElementById('filter-status').value;
  const tp = document.getElementById('filter-type').value;
  const gp = document.getElementById('filter-group').value;
  document.querySelectorAll('.tc-row').forEach(row => {
    const tc = TESTCASES.find(t => `row-${t.id}` === row.id);
    if (!tc) return;
    const text = (tc.id + tc.name + tc.given + tc.when + tc.then + (tc.ref||[]).join(' ')).toLowerCase();
    const show = (!q || text.includes(q))
      && (!st || state[tc.id].status === st)
      && (!tp || tc.type === tp)
      && (!gp || tc.group == gp);
    row.classList.toggle('hidden', !show);
  });
}

function toggleGroup(gid) {
  const body = document.getElementById(`group-body-${gid}`);
  body.style.display = body.style.display === 'none' ? '' : 'none';
}

function bulkStatus(status) {
  TESTCASES.forEach(tc => { setStatus(tc.id, status); });
  document.querySelectorAll(`input[type=radio][value="${status}"]`).forEach(r => r.checked = true);
}

function resetAll() {
  if (!confirm('Reset tất cả trạng thái và Bug ID?')) return;
  TESTCASES.forEach(tc => { state[tc.id] = { status: 'pending', bugId: '' }; });
  renderGroups();
  updateStats();
  document.getElementById('progress-bar').style.width = '0%';
}

function exportCsv() {
  const headers = ['TC ID','Nhóm','Tên TC','Loại','Given','When','Then','Tham chiếu','Trạng thái','Bug ID'];
  const rows = TESTCASES.map(tc => [
    tc.id, tc.groupName, tc.name, tc.type,
    tc.given, tc.when, tc.then, (tc.ref||[]).join(';'),
    state[tc.id].status, state[tc.id].bugId
  ]);
  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `TestChecklist_EXP.CAPEX_DOSSIER.3.3.1_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
</script>
</body>
</html>
