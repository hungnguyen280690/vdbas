  .stat-box.pos .val{color:var(--success)}
  .stat-box.neg .val{color:var(--danger)}
  .stat-box.pass .val{color:var(--success)}
  .stat-box.fail .val{color:var(--danger)}
  .stat-box.skip .val{color:var(--muted)}

  .progress-bar-fill{background:var(--success);height:100%;border-radius:10px;transition:width .3s}

  .tc-table tr[data-status="skip"]{background:#fafafa;opacity:.7}

  .badge-neg{background:#f8d7da;color:#721c24;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600}
  .badge-ref{background:#e2e3e5;color:#383d41;padding:1px 5px;border-radius:4px;font-size:10px;margin:1px}

  .col-result{min-width:130px}

<script>
  const TC_DATA = JSON.parse(document.getElementById('testcases-data').textContent);

    const container = document.getElementById('tc-container');

      if (!groups[tc.group]) groups[tc.group] = { name: tc.groupName, items: [] };
      groups[tc.group].items.push(tc);
    });
    container.innerHTML = '';
    Object.keys(groups).forEach(g => {
      const grp = groups[g];
      const visible = grp.items.filter(tc => isVisible(tc));
      if (visible.length === 0) return;
      const passCount = grp.items.filter(tc => state[tc.id].result === 'pass').length;
      const div = document.createElement('div');
      div.innerHTML = `
        <div class="group-header">
          <span>Nhóm ${g} — ${grp.name}</span>
          <span class="group-count">${passCount}/${grp.items.length} pass</span>
        </div>
        <table class="tc-table">
          <thead>
            <tr>
              <th style="width:170px">Mã TC</th>
              <th>Tên Testcase</th>
              <th>Loại</th>
              <th>Given</th>
              <th>When</th>
              <th>Then</th>
              <th>Tham chiếu</th>
              <th class="col-result">Kết quả</th>
              <th style="width:95px">Bug ID</th>
            </tr>
          </thead>
          <tbody id="tbody-g${g}"></tbody>
        </table>`;
      container.appendChild(div);
      const tbody = document.getElementById('tbody-g' + g);
      grp.items.forEach(tc => {
        const st = state[tc.id];
        const tr = document.createElement('tr');
        tr.dataset.tcId = tc.id;
        tr.dataset.status = st.result;
        tr.className = isVisible(tc) ? '' : 'hidden-row';
        tr.innerHTML = `
          <td style="font-family:monospace;font-size:11px;white-space:nowrap">${tc.id}</td>
          <td style="font-weight:600">${tc.name}</td>
          <td style="text-align:center"><span class="${tc.type==='Positive'?'badge-pos':'badge-neg'}">${tc.type==='Positive'?'+':'−'}</span></td>
          <td style="font-size:11px;color:var(--muted)">${tc.given}</td>
          <td style="font-size:11px">${tc.when}</td>
          <td style="font-size:11px">${tc.then}</td>
          <td>${(tc.ref||[]).map(r=>`<span class="badge-ref">${r}</span>`).join(' ')}</td>
          <td class="col-result">
            <div class="radio-group">
              <label><input type="radio" name="r-${tc.id}" value="pass" ${st.result==='pass'?'checked':''} onchange="setResult('${tc.id}','pass')"><span>✓ Pass</span></label>
              <label><input type="radio" name="r-${tc.id}" value="fail" ${st.result==='fail'?'checked':''} onchange="setResult('${tc.id}','fail')"><span>✗ Fail</span></label>
              <label><input type="radio" name="r-${tc.id}" value="skip" ${st.result==='skip'?'checked':''} onchange="setResult('${tc.id}','skip')"><span>— N/A</span></label>
            </div>
          </td>
          <td><input type="text" class="bug-input" placeholder="BUG-XXX" value="${st.bugId||''}" oninput="state['${tc.id}'].bugId=this.value"/></td>`;
        tbody.appendChild(tr);
      });
    });
    updateStats();
    updateFilteredCount();
  }

  function isVisible(tc) {
    const q = document.getElementById('flt-search')?.value.toLowerCase() || '';
    const r = document.getElementById('flt-result')?.value || '';
    const t = document.getElementById('flt-type')?.value || '';
    const g = document.getElementById('flt-group')?.value || '';
    if (q && !((tc.id+tc.name+tc.given+tc.when+tc.then+(tc.ref||[]).join(' ')).toLowerCase().includes(q))) return false;
    if (r && state[tc.id].result !== r) return false;
    if (t && tc.type !== t) return false;
    if (g && String(tc.group) !== g) return false;
    return true;
  }

  function setResult(id, val) {
    state[id].result = val;
    const tr = document.querySelector(`[data-tc-id="${id}"]`);
    if (tr) tr.dataset.status = val;
    updateStats();
  }

  function applyFilter() {
    document.querySelectorAll('[data-tc-id]').forEach(tr => {
      const tc = TCS.find(t => t.id === tr.dataset.tcId);
      if (tc) tr.className = isVisible(tc) ? '' : 'hidden-row';
    });
    updateFilteredCount();
  }

  function updateStats() {
    const pass = TCS.filter(t => state[t.id].result === 'pass').length;
    const fail = TCS.filter(t => state[t.id].result === 'fail').length;
    const skip = TCS.filter(t => state[t.id].result === 'skip').length;
    const executed = pass + fail;
    const pct = executed > 0 ? Math.round(pass / executed * 100) : 0;
    document.getElementById('st-pass').textContent = pass;
    document.getElementById('st-fail').textContent = fail;
    document.getElementById('st-skip').textContent = skip;
    document.getElementById('pass-pct').textContent = pct + '%';
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-label').textContent = `${executed} / ${TCS.length} TC đã thực thi`;
  }

  function updateFilteredCount() {
    const vis = TCS.filter(tc => isVisible(tc)).length;
    document.getElementById('filtered-count').textContent = vis;
  }

  function resetAll() {
    if (!confirm('Reset tất cả kết quả? Hành động không thể hoàn tác.')) return;
    TCS.forEach(tc => { state[tc.id] = { result: 'pending', bugId: '' }; });
    render();
  }

  function exportCSV() {
    const headers = ['Mã TC','Nhóm','Tên TC','Loại','Given','When','Then','Tham chiếu','Kết quả','Bug ID'];
    const rows = TCS.map(tc => {
      const s = state[tc.id];
      return [tc.id, tc.groupName, tc.name, tc.type, tc.given, tc.when, tc.then, (tc.ref||[]).join('; '), s.result, s.bugId]
        .map(v => '"' + String(v||'').replace(/"/g,'""') + '"').join(',');
    });
    const csv = [headers.join(','), ...rows].join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'TestChecklist_EXP.CAPEX_DOSSIER.3.3.2_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
  }

  render();
</script>
</body>
</html>
