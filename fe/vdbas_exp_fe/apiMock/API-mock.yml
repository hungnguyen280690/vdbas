openapi: 3.0.3

# ============================================================
# EXP.CAPEX_DOSSIER — API Mock Specification  (V0.2)
# Nguồn: EXP.CAPEX_DOSSIER.CRUD_spec_function_V0.2.md
# Mock server: Prism  →  npx @stoplight/prism-cli mock API-mock.yml -p 9090
# ============================================================

info:
  title: EXP.CAPEX_DOSSIER Mock API
  description: |
    Toàn bộ API mock cho chức năng Quản lý hồ sơ Chi đầu tư (CAPEX).
    Bao phủ luồng đầy đủ: Maker → Checker → Approver.

    **State Machine:**
    ```
    Start → DRAFT --[Save]--> SAVED --[Submit]--> SUBMITTED
                 ↑ [Edit]                              |
                 |                          [Check OK] ↓
                 |                         APPROVED(Checked) --[Approve]--> APPROVED(Done)
                 |                                    |
                 |                         [Reject]  ↓
                 |                              REJECTED ←──────────────────┘
                 └── [Delete (DRAFT/SAVED)] → CANCELLED
    ```

    **Field naming:** UPPER_SNAKE_CASE (spec §B4 rule 7).
    **Search pattern:** POST /search với body JSON (theo CLAUDE.md convention).

    **Servers:**
    - Mock: http://localhost:9090
    - Dev BE: http://localhost:8085

  version: 0.2.0
  contact:
    name: VDBAS Team

servers:
  - url: http://localhost:9090/api/v1
    description: Mock server (Prism)
  - url: http://localhost:8085/api/v1
    description: Dev Backend

tags:
  - name: Dossier
    description: CRUD + workflow hồ sơ CAPEX (EXP_DOSSIER)
  - name: Document
    description: Chứng từ thuộc hồ sơ (EXP_DOCUMENT)
  - name: Attachment
    description: File đính kèm hồ sơ (EXP_DOSSIER_ATTACHMENT)
  - name: History
    description: Lịch sử audit + phê duyệt (EXP_AUDIT_LOG, EXP_APPROVAL_LOG)
  - name: MasterData
    description: Danh mục tra cứu (LOV.01, LOV.03, LOV.05 …)
  - name: ACL
    description: Phân quyền menu và API (served at /api, not /api/v1)

# ─────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────
paths:

  # ══════════════════════════════════════════════════════════
  # DOSSIER — List / Search
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier/search:
    post:
      tags: [Dossier]
      summary: Tìm kiếm / Danh sách hồ sơ
      description: |
        Tìm kiếm hồ sơ theo bộ lọc, phân trang, sắp xếp.
        Event: `EXP.CAPEX_DOSSIER.LIST.SEARCH`
      operationId: searchDossiers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DossierSearchRequest'
            example:
              DOSSIER_CODE: ""
              PROJECT_CODE: ""
              SEARCH: ""
              DATE_FIELD: "SEND_DATE"
              FROM_DATE: ""
              TO_DATE: ""
              F_STATUS: []
              DATA_SOURCE_CODE: []
              CREATED_BY: ""
              PAGE: 0
              SIZE: 20
              SORT_BY: "CREATED_DATE"
              SORT_DIR: "DESC"
      responses:
        '200':
          description: Danh sách hồ sơ phân trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierPageResponse'
              examples:
                default:
                  $ref: '#/components/examples/DossierListExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ══════════════════════════════════════════════════════════
  # DOSSIER — Create
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier:
    post:
      tags: [Dossier]
      summary: Tạo mới hồ sơ
      description: |
        Khởi tạo hồ sơ mới với trạng thái DRAFT.
        Event: `EXP.CAPEX_DOSSIER.NEW.OPEN` → auto-fill DOSSIER_DATE, DATA_SOURCE_CODE=Thủ công.
        DOSSIER_CODE được sinh sau khi gọi Save (không phải khi Open).
      operationId: createDossier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DossierCreateRequest'
            example:
              SEND_DATE: "2026-06-17"
              PROJECT_CODE: "7122155"
              PROJECT_MANAGEMENT_CODE: "3029123"
              DATA_SOURCE_CODE: "Thủ công"
      responses:
        '201':
          description: Hồ sơ được tạo thành công (DRAFT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierDetail'
              example:
                ID: "a1b2c3d4-0001-0000-0000-000000000001"
                DOSSIER_CODE: "HS-CHI-2026-0011"
                SEND_DATE: "2026-06-17"
                DATA_SOURCE_CODE: "Thủ công"
                F_STATUS: "DRAFT"
                VERSION: 1
                PROJECT_CODE: "7122155"
                PROJECT_NAME: "Dự án nâng cấp bệnh viện Bạch Mai"
                PROJECT_TYPE: "Citizen"
                PROJECT_SPECIFIC_CODE: null
                PROJECT_SPECIFIC_NAME: null
                PROJECT_MANAGEMENT_CODE: "3029123"
                PROJECT_MANAGEMENT_NAME: "BQLDA bệnh viện Bạch Mai"
                TREASURY_CODE: "0012"
                TREASURY_NAME: "Kho bạc nhà nước khu vực I - PGD số 12"
                ASSIGN_USER: "nguyen.van.a"
                DOCUMENT_COUNT: 0
                TOTAL_LOCAL_AMOUNT: 0
                DOCUMENTS: []
                ATTACHMENTS: []
                CREATED_BY: "nguyen.van.a"
                CREATED_DATE: "2026-06-17T08:00:00"
                UPDATED_BY: "nguyen.van.a"
                UPDATED_DATE: "2026-06-17T08:00:00"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateWarning'

  # ══════════════════════════════════════════════════════════
  # DOSSIER — Get / Update / Delete by ID
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier/{id}:
    parameters:
      - $ref: '#/components/parameters/DossierId'

    get:
      tags: [Dossier]
      summary: Xem chi tiết hồ sơ
      description: |
        Trả về đầy đủ thông tin hồ sơ: header + danh sách chứng từ (DOCUMENTS) +
        đính kèm (ATTACHMENTS) + lịch sử phê duyệt (APPROVAL_HISTORY).
        Event: `EXP.CAPEX_DOSSIER.VIEW.OPEN`
      operationId: getDossier
      responses:
        '200':
          description: Chi tiết hồ sơ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierDetail'
              examples:
                draft_dossier:
                  summary: Hồ sơ DRAFT (REC-001)
                  $ref: '#/components/examples/DossierDetailDraft'
                submitted_dossier:
                  summary: Hồ sơ SUBMITTED (REC-002)
                  $ref: '#/components/examples/DossierDetailSubmitted'
                approved_dossier:
                  summary: Hồ sơ APPROVED (REC-004)
                  $ref: '#/components/examples/DossierDetailApproved'
                rejected_dossier:
                  summary: Hồ sơ REJECTED (REC-005)
                  $ref: '#/components/examples/DossierDetailRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags: [Dossier]
      summary: Cập nhật hồ sơ
      description: |
        Cập nhật thông tin header hồ sơ. Chỉ áp dụng khi F_STATUS ∈ {DRAFT, SAVED}.
        Kiểm tra optimistic lock qua trường VERSION (VAL-15).
        Event: `EXP.CAPEX_DOSSIER.EDIT.SAVE`
      operationId: updateDossier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DossierUpdateRequest'
            example:
              SEND_DATE: "2026-06-18"
              PROJECT_CODE: "7122155"
              PROJECT_MANAGEMENT_CODE: "3029123"
              VERSION: 1
      responses:
        '200':
          description: Hồ sơ đã cập nhật (VERSION+1, ghi audit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/OptimisticLock'
        '422':
          $ref: '#/components/responses/StatusNotAllowed'

    delete:
      tags: [Dossier]
      summary: Xoá mềm hồ sơ
      description: |
        Soft-delete: F_STATUS → CANCELLED, STATUS=0. Chỉ khi F_STATUS ∈ {DRAFT, SAVED}.
        Bắt buộc lý do ≥ 10 ký tự + CONFIRM_REVIEWED=true (VAL-16).
        Event: `EXP.CAPEX_DOSSIER.DELETE.CONFIRM`
      operationId: deleteDossier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DossierDeleteRequest'
            example:
              DELETE_REASON: "Lập trùng hồ sơ, hủy bỏ theo yêu cầu ban QLDA"
              CONFIRM_REVIEWED: true
      responses:
        '204':
          description: Đã xoá thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/StatusNotAllowed'

  # ══════════════════════════════════════════════════════════
  # DOSSIER — Save Draft
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier/{id}/save-draft:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    post:
      tags: [Dossier]
      summary: Lưu nháp
      description: |
        Lưu nháp với validate tối thiểu (định dạng). F_STATUS giữ nguyên DRAFT.
        Event: `EXP.CAPEX_DOSSIER.NEW.SAVE_DRAFT`
      operationId: saveDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DossierUpdateRequest'
      responses:
        '200':
          description: Đã lưu nháp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierDetail'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ══════════════════════════════════════════════════════════
  # DOSSIER — Save (DRAFT → SAVED)
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier/{id}/save:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    post:
      tags: [Dossier]
      summary: Lưu hồ sơ (DRAFT → SAVED)
      description: |
        Validate cơ bản; chuyển trạng thái DRAFT → SAVED; sinh/giữ DOSSIER_CODE.
        Event: `EXP.CAPEX_DOSSIER.NEW.SAVE`
      operationId: saveDossier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DossierUpdateRequest'
      responses:
        '200':
          description: Hồ sơ đã lưu (F_STATUS=SAVED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierDetail'
              example:
                ID: "a1b2c3d4-0001-0000-0000-000000000007"
                DOSSIER_CODE: "HS-CHI-2026-0007"
                F_STATUS: "SAVED"
                VERSION: 1
                SEND_DATE: "2026-05-28"
                PROJECT_CODE: "7122155"
                PROJECT_NAME: "Dự án nâng cấp bệnh viện Bạch Mai"
                PROJECT_TYPE: "Citizen"
                PROJECT_SPECIFIC_CODE: null
                PROJECT_SPECIFIC_NAME: null
                PROJECT_MANAGEMENT_CODE: "3029123"
                PROJECT_MANAGEMENT_NAME: "BQLDA bệnh viện Bạch Mai"
                DATA_SOURCE_CODE: "Thủ công"
                ASSIGN_USER: "nguyen.van.a"
                DOCUMENT_COUNT: 0
                TOTAL_LOCAL_AMOUNT: 0
                DOCUMENTS: []
                ATTACHMENTS: []
                CREATED_BY: "nguyen.van.a"
                CREATED_DATE: "2026-05-28T08:00:00"
                UPDATED_BY: "nguyen.van.a"
                UPDATED_DATE: "2026-05-28T08:00:00"
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/DuplicateWarning'

  # ══════════════════════════════════════════════════════════
  # DOSSIER — Submit (SAVED/VALIDATED → SUBMITTED)
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    post:
      tags: [Dossier]
      summary: Gửi kiểm soát
      description: |
        Validate đầy đủ (§A8); chuyển F_STATUS SAVED/VALIDATED → SUBMITTED;
        assign Checker; gửi notification Checker.
        BIZ-012: Hồ sơ phải có ≥1 chứng từ hợp lệ.
        Event: `EXP.CAPEX_DOSSIER.NEW.SUBMIT`
      operationId: submitDossier
      responses:
        '200':
          description: Đã gửi kiểm soát (F_STATUS=SUBMITTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierStatusResponse'
              example:
                ID: "a1b2c3d4-0001-0000-0000-000000000001"
                DOSSIER_CODE: "HS-CHI-2026-0001"
                F_STATUS: "SUBMITTED"
                VERSION: 2
                MESSAGE_CODE: "VDBAS-EXP-SUC02"
                MESSAGE: "Đã gửi hồ sơ để kiểm soát/phê duyệt"
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/StatusNotAllowed'

  # ══════════════════════════════════════════════════════════
  # DOSSIER — Cancel Record (record-level, khác với form-level Cancel)
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    post:
      tags: [Dossier]
      summary: Hủy bỏ hồ sơ (record-level)
      description: |
        Hủy bỏ hồ sơ đã lưu (không phải huỷ form). F_STATUS → CANCELLED.
        Event: `EXP.CAPEX_DOSSIER.CANCEL` [P1-6]
      operationId: cancelDossier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [CANCEL_REASON]
              properties:
                CANCEL_REASON:
                  type: string
                  minLength: 10
                  maxLength: 500
                  description: Lý do hủy bỏ
            example:
              CANCEL_REASON: "Hủy bỏ theo yêu cầu của ban quản lý dự án"
      responses:
        '200':
          description: Đã hủy bỏ hồ sơ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/StatusNotAllowed'

  # ══════════════════════════════════════════════════════════
  # DOSSIER — Copy
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier/{id}/copy:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    post:
      tags: [Dossier]
      summary: Sao chép hồ sơ thành bản nháp mới
      description: |
        Sao chép hồ sơ hiện tại thành bản nháp mới (DRAFT).
        Event: `EXP.CAPEX_DOSSIER.NEW.COPY` [P1-5]
      operationId: copyDossier
      responses:
        '201':
          description: Hồ sơ mới được tạo từ bản sao (DRAFT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierDetail'

  # ══════════════════════════════════════════════════════════
  # WORKFLOW — Check (Checker approve: SUBMITTED → APPROVED/Checked)
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier/{id}/check:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    post:
      tags: [Dossier]
      summary: Kiểm soát (Checker approve)
      description: |
        Checker kiểm soát thành công: SUBMITTED → APPROVED (hiển thị "Đã kiểm soát").
        Assign Approver; gửi notification.
        Event: `EXP.CAPEX_DOSSIER.APPROVE.APPROVE` (role=Checker)
      operationId: checkDossier
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                NOTE:
                  type: string
                  maxLength: 500
                  description: Ghi chú kiểm soát (tuỳ chọn)
      responses:
        '200':
          description: Đã kiểm soát (F_STATUS=APPROVED, ASSIGN_USER=Approver)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierStatusResponse'
              example:
                ID: "a1b2c3d4-0001-0000-0000-000000000002"
                DOSSIER_CODE: "HS-CHI-2026-0002"
                F_STATUS: "APPROVED"
                APPROVAL_STEP: "CHECKED"
                VERSION: 3
                CHECKED_BY: "nguyen.checker"
                CHECKED_DATE: "2026-06-17T10:30:00"
                MESSAGE_CODE: "VDBAS-EXP-SUC04"
                MESSAGE: "Kiểm soát hồ sơ thành công"
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/StatusNotAllowed'

  # ══════════════════════════════════════════════════════════
  # WORKFLOW — Approve (Approver: APPROVED/Checked → APPROVED/Done)
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    post:
      tags: [Dossier]
      summary: Phê duyệt (Approver)
      description: |
        Approver phê duyệt: APPROVED(Checked) → APPROVED(Done).
        Trigger luồng nghiệp vụ kế tiếp; notify Maker.
        Event: `EXP.CAPEX_DOSSIER.APPROVE.APPROVE` (role=Approver)
      operationId: approveDossier
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                NOTE:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Đã phê duyệt (F_STATUS=APPROVED, ASSIGN_USER=Done)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierStatusResponse'
              example:
                ID: "a1b2c3d4-0001-0000-0000-000000000003"
                DOSSIER_CODE: "HS-CHI-2026-0003"
                F_STATUS: "APPROVED"
                APPROVAL_STEP: "APPROVED"
                VERSION: 4
                APPROVED_BY: "tran.approver"
                APPROVED_DATE: "2026-06-17T14:00:00"
                MESSAGE_CODE: "VDBAS-EXP-SUC05"
                MESSAGE: "Phê duyệt hồ sơ thành công"
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/StatusNotAllowed'

  # ══════════════════════════════════════════════════════════
  # WORKFLOW — Reject (Checker hoặc Approver từ chối)
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    post:
      tags: [Dossier]
      summary: Từ chối (Checker hoặc Approver)
      description: |
        Từ chối kiểm soát (SUBMITTED → REJECTED) hoặc từ chối phê duyệt (APPROVED/Checked → REJECTED).
        Lý do bắt buộc ≥ 10 ký tự (BIZ-006).
        Event: `EXP.CAPEX_DOSSIER.APPROVE.REJECT`
      operationId: rejectDossier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRejectRequest'
            example:
              REASON: "Chứng từ chưa đủ hạng mục theo hợp đồng đã ký"
      responses:
        '200':
          description: Đã từ chối (F_STATUS=REJECTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierStatusResponse'
              example:
                ID: "a1b2c3d4-0001-0000-0000-000000000005"
                DOSSIER_CODE: "HS-CHI-2026-0005"
                F_STATUS: "REJECTED"
                VERSION: 3
                MESSAGE_CODE: "VDBAS-EXP-INF04"
                MESSAGE: "Hồ sơ đã bị từ chối kiểm soát"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/StatusNotAllowed'

  # ══════════════════════════════════════════════════════════
  # DOSSIER — Export
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier/export:
    post:
      tags: [Dossier]
      summary: Xuất danh sách
      description: |
        Xuất Excel/PDF/CSV theo bộ lọc hiện tại.
        Sync nếu < 50k bản ghi, async (task ID) nếu vượt.
        Event: `EXP.CAPEX_DOSSIER.LIST.EXPORT`
      operationId: exportDossiers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DossierSearchRequest'
                - type: object
                  required: [FORMAT]
                  properties:
                    FORMAT:
                      type: string
                      enum: [EXCEL, PDF, CSV]
                      description: Định dạng xuất
            example:
              FORMAT: "EXCEL"
              F_STATUS: ["SUBMITTED", "APPROVED"]
              FROM_DATE: "2026-01-01"
              TO_DATE: "2026-06-17"
      responses:
        '200':
          description: File xuất (binary) hoặc task ID nếu async
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                properties:
                  TASK_ID:
                    type: string
                  STATUS:
                    type: string
                    enum: [PROCESSING, DONE, FAILED]

  # ══════════════════════════════════════════════════════════
  # DOSSIER — Print Preview
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier/{id}/print:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    get:
      tags: [Dossier]
      summary: In phiếu (PDF preview)
      description: |
        Sinh PDF preview theo template nghiệp vụ.
        Event: `EXP.CAPEX_DOSSIER.VIEW.PRINT` [P1-10]
      operationId: printDossier
      responses:
        '200':
          description: PDF preview
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  # ══════════════════════════════════════════════════════════
  # DOCUMENTS — List / Add
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier/{id}/documents:
    parameters:
      - $ref: '#/components/parameters/DossierId'

    get:
      tags: [Document]
      summary: Danh sách chứng từ thuộc hồ sơ
      description: |
        Trả về grid chứng từ (§B1.2). Hiển thị sau khi hồ sơ đã được lưu lần đầu.
        Event: `EXP.CAPEX_DOSSIER.VIEW.GENERAL` (xem tab Thông tin hồ sơ)
      operationId: listDocuments
      responses:
        '200':
          description: Danh sách chứng từ
          content:
            application/json:
              schema:
                type: object
                properties:
                  DOCUMENTS:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentSummary'
                  TOTAL_BASE_AMOUNT:
                    type: number
                    description: Tổng tiền VND (footer "Tổng cộng")
              example:
                DOCUMENTS:
                  - SEQ_NO: 1
                    DOCUMENT_ID: "doc-uuid-001"
                    DOCUMENT_NAME: "Giấy rút vốn dự án hạng mục A"
                    DOCUMENT_NO: "EXP/CAPEX/2026/00001"
                    DOCUMENT_DATE: "2026-05-10"
                    ACCOUNTING_DATE: "2026-05-15"
                    ORIGINAL_AMOUNT: null
                    BASE_AMOUNT: 800000000
                    F_STATUS: "DRAFT"
                  - SEQ_NO: 2
                    DOCUMENT_ID: "doc-uuid-002"
                    DOCUMENT_NAME: "Giấy đề nghị thanh toán thiết bị y tế"
                    DOCUMENT_NO: "EXP/CAPEX/2026/00002"
                    DOCUMENT_DATE: "2026-05-12"
                    ACCOUNTING_DATE: "2026-05-15"
                    ORIGINAL_AMOUNT: null
                    BASE_AMOUNT: 700000000
                    F_STATUS: "DRAFT"
                TOTAL_BASE_AMOUNT: 1500000000
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Document]
      summary: Thêm chứng từ vào hồ sơ
      description: |
        Link chứng từ đã tồn tại vào hồ sơ, hoặc mở LOV.Chứng từ để chọn.
        Event: `EXP.CAPEX_DOSSIER.NEW.ADD_DOC` [P1-11]
        Hồ sơ phải đã có DOSSIER_CODE (đã lưu lần đầu).
      operationId: addDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DOCUMENT_TYPE_CODE]
              properties:
                DOCUMENT_TYPE_CODE:
                  type: string
                  description: Mã loại chứng từ từ LOV.Chứng từ
                DOCUMENT_ID:
                  type: string
                  description: UUID chứng từ đã tồn tại (nếu chọn từ LOV)
            example:
              DOCUMENT_TYPE_CODE: "Giấy ĐNTT"
      responses:
        '201':
          description: Chứng từ đã được thêm vào hồ sơ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSummary'
        '400':
          $ref: '#/components/responses/BadRequest'

  /exp/capex-dossier/{id}/documents/{docId}:
    parameters:
      - $ref: '#/components/parameters/DossierId'
      - name: docId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID chứng từ

    delete:
      tags: [Document]
      summary: Xoá chứng từ khỏi hồ sơ
      description: |
        Xoá liên kết chứng từ khỏi hồ sơ. Chỉ khi hồ sơ ở DRAFT/SAVED.
      operationId: removeDocument
      responses:
        '204':
          description: Đã xoá chứng từ khỏi hồ sơ
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/StatusNotAllowed'

  # ══════════════════════════════════════════════════════════
  # ATTACHMENTS — List / Upload / Delete / Download
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/DossierId'

    get:
      tags: [Attachment]
      summary: Danh sách đính kèm
      description: |
        Liệt kê tất cả file đính kèm của hồ sơ.
        Event: `EXP.CAPEX_DOSSIER.VIEW.ATTACHMENTS` [P2-7]
      operationId: listAttachments
      responses:
        '200':
          description: Danh sách file đính kèm
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachmentInfo'
              example:
                - ATTACHMENT_ID: "att-uuid-001"
                  FILE_NAME: "hop_dong_thi_cong.pdf"
                  ATTACHMENT_TYPE_CODE: "Hợp đồng"
                  FILE_TYPE: "pdf"
                  FILE_SIZE: 524288
                  DESCRIPTION: "Hợp đồng thi công xây lắp số 004"
                  CREATED_BY: "nguyen.van.a"
                  CREATED_DATE: "2026-05-15T09:20:00"

    post:
      tags: [Attachment]
      summary: Upload file đính kèm
      description: |
        Upload file đính kèm. Validate: ≤ 10MB/file; định dạng pdf/docx/xlsx/jpg/png.
        Kiểm tra MIME + magic byte. Quét virus trước khi lưu (BIZ-005).
        Event: `EXP.CAPEX_DOSSIER.ATTACH.UPLOAD`
      operationId: uploadAttachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [FILE, ATTACHMENT_TYPE_CODE]
              properties:
                FILE:
                  type: string
                  format: binary
                  description: File upload (≤ 10MB, pdf/docx/xlsx/jpg/png)
                ATTACHMENT_TYPE_CODE:
                  type: string
                  enum: ["Chứng từ gốc", "Hợp đồng", "Hoá đơn", "Bảng kê", "Văn bản khác"]
                  description: Loại tài liệu
                DESCRIPTION:
                  type: string
                  maxLength: 250
                  description: Mô tả (tuỳ chọn)
      responses:
        '201':
          description: Upload thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentInfo'
              example:
                ATTACHMENT_ID: "att-uuid-002"
                FILE_NAME: "bao_cao_tien_do.pdf"
                ATTACHMENT_TYPE_CODE: "Chứng từ gốc"
                FILE_TYPE: "pdf"
                FILE_SIZE: 102400
                DESCRIPTION: ""
                CREATED_BY: "nguyen.van.a"
                CREATED_DATE: "2026-06-17T09:00:00"
        '400':
          description: File không hợp lệ (kích thước hoặc định dạng)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                too_large:
                  summary: File vượt 10MB
                  value:
                    ERROR_CODE: "VDBAS-VAL-0014"
                    MESSAGE: "Kích thước file vượt giới hạn cho phép (10MB)"
                    TRACE_ID: "trace-001"
                wrong_format:
                  summary: Định dạng không hỗ trợ
                  value:
                    ERROR_CODE: "VDBAS-VAL-0015"
                    MESSAGE: "Định dạng tệp không được hỗ trợ. Cho phép: pdf, docx, xlsx, jpg, png"
                    TRACE_ID: "trace-002"

  /exp/capex-dossier/{id}/attachments/{attachId}:
    parameters:
      - $ref: '#/components/parameters/DossierId'
      - name: attachId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      tags: [Attachment]
      summary: Xoá file đính kèm
      description: |
        Xoá file đính kèm. Phím tắt: Shift+Delete.
        Event: `EXP.CAPEX_DOSSIER.ATTACH.DELETE`
      operationId: deleteAttachment
      responses:
        '204':
          description: Đã xoá file đính kèm

  /exp/capex-dossier/{id}/attachments/{attachId}/download:
    parameters:
      - $ref: '#/components/parameters/DossierId'
      - name: attachId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Attachment]
      summary: Tải xuống file đính kèm
      description: |
        Tải file về máy. Ghi audit truy cập. Phím tắt: Ctrl+J.
        Event: `EXP.CAPEX_DOSSIER.ATTACH.DOWNLOAD`
      operationId: downloadAttachment
      responses:
        '200':
          description: File binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  # ══════════════════════════════════════════════════════════
  # HISTORY — Audit Log
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier/{id}/history:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    get:
      tags: [History]
      summary: Lịch sử thay đổi (Audit Log)
      description: |
        Lịch sử thay đổi hồ sơ: CREATED_BY, CREATED_DATE, UPDATED_BY, UPDATED_DATE,
        action, oldValue→newValue. Sort DESC (mới nhất lên đầu).
        Event: `EXP.CAPEX_DOSSIER.VIEW.HISTORY` (Alt+H)
      operationId: getDossierHistory
      responses:
        '200':
          description: Lịch sử audit
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntry'
              example:
                - SEQ_NO: 3
                  ACTION_TYPE: "SUBMIT"
                  USER_ID: "nguyen.van.a"
                  ACTION_TIMESTAMP: "2026-05-15T10:30:00"
                  IP_ADDRESS: "192.168.1.10"
                  OLD_VALUE: '{"F_STATUS":"SAVED"}'
                  NEW_VALUE: '{"F_STATUS":"SUBMITTED"}'
                - SEQ_NO: 2
                  ACTION_TYPE: "UPDATE"
                  USER_ID: "nguyen.van.a"
                  ACTION_TIMESTAMP: "2026-05-15T09:30:00"
                  IP_ADDRESS: "192.168.1.10"
                  OLD_VALUE: '{"SEND_DATE":"2026-05-14"}'
                  NEW_VALUE: '{"SEND_DATE":"2026-05-15"}'
                - SEQ_NO: 1
                  ACTION_TYPE: "INSERT"
                  USER_ID: "nguyen.van.a"
                  ACTION_TIMESTAMP: "2026-05-15T09:12:00"
                  IP_ADDRESS: "192.168.1.10"
                  OLD_VALUE: null
                  NEW_VALUE: '{"DOSSIER_CODE":"HS-CHI-2026-0001","F_STATUS":"DRAFT"}'

  # ══════════════════════════════════════════════════════════
  # HISTORY — Approval History
  # ══════════════════════════════════════════════════════════
  /exp/capex-dossier/{id}/approval-history:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    get:
      tags: [History]
      summary: Lịch sử phê duyệt (Approval Log)
      description: |
        Luồng Maker→Checker→Approver với timestamp và lý do.
        Event: `EXP.CAPEX_DOSSIER.VIEW.APPROVAL` (Alt+P)
      operationId: getApprovalHistory
      responses:
        '200':
          description: Lịch sử phê duyệt
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalLogEntry'
              example:
                - LOG_ID: "log-uuid-001"
                  ACTION_USER: "nguyen.van.a"
                  ACTION_ROLE: "Maker"
                  ACTION_DATE: "2026-05-15T10:30:00"
                  STATE_CODE: "SUBMITTED"
                  REASON: "Đã có đủ chứng từ"
                - LOG_ID: "log-uuid-002"
                  ACTION_USER: "nguyen.checker"
                  ACTION_ROLE: "Checker"
                  ACTION_DATE: "2026-05-16T09:00:00"
                  STATE_CODE: "APPROVED"
                  REASON: null

