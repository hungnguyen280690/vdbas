# ─────────────────────────────────────────────────────────────
# Note: Prism phục vụ cả /api và /api/v1 từ cùng mock server.
# FE: aclGet("/menus") → http://localhost:9090/api/menus
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────
components:

  parameters:
    DossierId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID hồ sơ (EXP_DOSSIER.ID)
      example: "a1b2c3d4-0001-0000-0000-000000000001"

  # ─────────────────────────────────────────────────────────
  # SCHEMAS
  # ─────────────────────────────────────────────────────────
  schemas:

    # ── Search Request ───────────────────────────────────────
    DossierSearchRequest:
      type: object
      properties:
        DOSSIER_CODE:
          type: string
          description: Mã hồ sơ (tìm chính xác hoặc starts-with)
        PROJECT_CODE:
          type: string
          description: Mã dự án
        SEARCH:
          type: string
          description: Tìm nhanh theo Người lập / Tên dự án [P1-12]
        DATE_FIELD:
          type: string
          enum: [SEND_DATE, CREATED_DATE, CHECKED_DATE, APPROVED_DATE]
          default: SEND_DATE
          description: Loại ngày lọc
        FROM_DATE:
          type: string
          format: date
          description: Từ ngày (theo DATE_FIELD)
        TO_DATE:
          type: string
          format: date
          description: Đến ngày (≥ FROM_DATE)
        F_STATUS:
          type: array
          items:
            type: string
            enum: [DRAFT, SAVED, VALIDATED, SUBMITTED, APPROVED, REJECTED, COMPLETED, CANCELLED]
          description: Multi-select trạng thái [P1-13]
        DATA_SOURCE_CODE:
          type: array
          items:
            type: string
            enum: ["Thủ công", "DVC"]
          description: Multi-select nguồn [P1-13]
        CREATED_BY:
          type: string
          description: Username người lập
        PAGE:
          type: integer
          minimum: 0
          default: 0
          description: Trang (0-based, theo Spring)
        SIZE:
          type: integer
          enum: [20, 50, 100, 200]
          default: 20
          description: Số bản ghi/trang
        SORT_BY:
          type: string
          default: CREATED_DATE
        SORT_DIR:
          type: string
          enum: [ASC, DESC]
          default: DESC

    # ── Dossier Page Response ────────────────────────────────
    DossierPageResponse:
      type: object
      properties:
        CONTENT:
          type: array
          items:
            $ref: '#/components/schemas/DossierSummary'
        TOTAL_ELEMENTS:
          type: integer
        TOTAL_PAGES:
          type: integer
        PAGE:
          type: integer
        SIZE:
          type: integer
        STATUS_COUNTS:
          type: object
          description: Đếm số bản ghi theo từng trạng thái [P2-11]
          additionalProperties:
            type: integer
          example:
            DRAFT: 2
            SAVED: 1
            SUBMITTED: 1
            APPROVED: 3
            REJECTED: 2
            COMPLETED: 1
            CANCELLED: 1
            VALIDATED: 1
        TOTAL_BASE_AMOUNT:
          type: number
          description: Tổng tiền VND các hồ sơ khớp bộ lọc (≠ CANCELLED)

    # ── Dossier Summary (grid row) ───────────────────────────
    DossierSummary:
      type: object
      properties:
        ID:
          type: string
          format: uuid
        DOSSIER_CODE:
          type: string
          description: Mã hồ sơ (link → view)
        PROJECT_CODE:
          type: string
        PROJECT_NAME:
          type: string
        DATA_SOURCE_CODE:
          type: string
        SEND_DATE:
          type: string
          format: date
          description: Ngày gửi (dd/MM/yyyy)
        F_STATUS:
          type: string
          enum: [DRAFT, SAVED, VALIDATED, SUBMITTED, APPROVED, REJECTED, COMPLETED, CANCELLED]
        CREATED_BY:
          type: string
        CREATED_DATE:
          type: string
          format: date-time
        DOCUMENT_COUNT:
          type: integer
          description: Số chứng từ trong hồ sơ
        TOTAL_LOCAL_AMOUNT:
          type: number
          description: Tổng tiền VND (TOTAL_BASE_AMOUNT)
        # Cột tuỳ chọn (hideable, mặc định ẩn)
        CHECKED_BY:
          type: string
          nullable: true
        CHECKED_DATE:
          type: string
          format: date-time
          nullable: true
        CHECK_REJECTION_REASON:
          type: string
          nullable: true
        APPROVED_BY:
          type: string
          nullable: true
        APPROVED_DATE:
          type: string
          format: date-time
          nullable: true
        APPROVAL_REJECTION_REASON:
          type: string
          nullable: true
        RETURNING_REASON:
          type: string
          nullable: true

    # ── Dossier Create Request ───────────────────────────────
    DossierCreateRequest:
      type: object
      required: [PROJECT_CODE, PROJECT_MANAGEMENT_CODE, SEND_DATE]
      properties:
        SEND_DATE:
          type: string
          format: date
          description: Ngày gửi hồ sơ (mặc định ngày hiện tại)
        PROJECT_CODE:
          type: string
          description: Mã dự án/công trình (LOV.01)
        PROJECT_SPECIFIC_CODE:
          type: string
          nullable: true
          description: Mã dự án đặc thù (chỉ khi PROJECT_TYPE=Military)
        PROJECT_MANAGEMENT_CODE:
          type: string
          description: Mã ĐVQHNS (LOV.05)
        DATA_SOURCE_CODE:
          type: string
          enum: ["Thủ công", "DVC"]
          default: "Thủ công"
          description: Nguồn (mặc định Thủ công, read-only sau khi lưu)

    # ── Dossier Update Request ───────────────────────────────
    DossierUpdateRequest:
      type: object
      required: [VERSION]
      properties:
        SEND_DATE:
          type: string
          format: date
        PROJECT_CODE:
          type: string
        PROJECT_SPECIFIC_CODE:
          type: string
          nullable: true
        PROJECT_MANAGEMENT_CODE:
          type: string
        VERSION:
          type: integer
          description: Optimistic lock version (F-VER) — VAL-15

    # ── Dossier Delete Request ───────────────────────────────
    DossierDeleteRequest:
      type: object
      required: [DELETE_REASON, CONFIRM_REVIEWED]
      properties:
        DELETE_REASON:
          type: string
          minLength: 10
          maxLength: 500
          description: Lý do xoá (VAL-16)
        CONFIRM_REVIEWED:
          type: boolean
          description: Xác nhận đã rà soát (phải = true để enable nút Xác nhận)

    # ── Dossier Detail (full view) ───────────────────────────
    DossierDetail:
      type: object
      properties:
        ID:
          type: string
          format: uuid
        DOSSIER_CODE:
          type: string
          description: Immutable sau khi sinh (VAL-17)
        SEND_DATE:
          type: string
          format: date
        DATA_SOURCE_CODE:
          type: string
          description: Read-only sau khi lưu lần đầu
        F_STATUS:
          type: string
          enum: [DRAFT, SAVED, VALIDATED, SUBMITTED, APPROVED, REJECTED, COMPLETED, CANCELLED]
        VERSION:
          type: integer
          description: Optimistic lock version (F-VER)
        PROJECT_CODE:
          type: string
        PROJECT_NAME:
          type: string
        PROJECT_TYPE:
          type: string
          enum: [Military, Citizen]
        PROJECT_SPECIFIC_CODE:
          type: string
          nullable: true
        PROJECT_SPECIFIC_NAME:
          type: string
          nullable: true
        PROJECT_MANAGEMENT_CODE:
          type: string
        PROJECT_MANAGEMENT_NAME:
          type: string
        TREASURY_CODE:
          type: string
        TREASURY_NAME:
          type: string
        ASSIGN_USER:
          type: string
          description: Người đang giữ xử lý (backend only §B5)
        DOCUMENT_COUNT:
          type: integer
        TOTAL_LOCAL_AMOUNT:
          type: number
        DOCUMENTS:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
          description: Grid chứng từ (§B1.2) — không hiển thị khi NEW
        ATTACHMENTS:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentInfo'
        CHECKED_BY:
          type: string
          nullable: true
        CHECKED_DATE:
          type: string
          format: date-time
          nullable: true
        APPROVED_BY:
          type: string
          nullable: true
        APPROVED_DATE:
          type: string
          format: date-time
          nullable: true
        CHECK_REJECTION_REASON:
          type: string
          nullable: true
        APPROVAL_REJECTION_REASON:
          type: string
          nullable: true
        DELETE_REASON:
          type: string
          nullable: true
        ACCOUNTING_STATUS:
          type: string
          nullable: true
          description: GL_POSTED / GL_ACCOUNTED (VAL-21)
        CREATED_BY:
          type: string
        CREATED_DATE:
          type: string
          format: date-time
        UPDATED_BY:
          type: string
        UPDATED_DATE:
          type: string
          format: date-time

    # ── Dossier Status Response (sau workflow action) ────────
    DossierStatusResponse:
      type: object
      properties:
        ID:
          type: string
          format: uuid
        DOSSIER_CODE:
          type: string
        F_STATUS:
          type: string
        APPROVAL_STEP:
          type: string
          nullable: true
          description: CHECKED | APPROVED (phân biệt trong cùng F_STATUS=APPROVED)
        VERSION:
          type: integer
        MESSAGE_CODE:
          type: string
          description: VDBAS-EXP-SUCxx
        MESSAGE:
          type: string
        CHECKED_BY:
          type: string
          nullable: true
        CHECKED_DATE:
          type: string
          format: date-time
          nullable: true
        APPROVED_BY:
          type: string
          nullable: true
        APPROVED_DATE:
          type: string
          format: date-time
          nullable: true

    # ── Document Summary (in grid §B1.2) ─────────────────────
    DocumentSummary:
      type: object
      properties:
        SEQ_NO:
          type: integer
          description: STT (tự động, read-only)
        DOCUMENT_ID:
          type: string
          format: uuid
        DOCUMENT_NAME:
          type: string
          description: Tên chứng từ (từ LOV.Chứng từ) [P1-3]
        DOCUMENT_NO:
          type: string
          description: Số chứng từ (EXP/CAPEX/YYYY/XXXXX)
        DOCUMENT_DATE:
          type: string
          format: date
          description: Ngày chứng từ (dd/MM/yyyy)
        ACCOUNTING_DATE:
          type: string
          format: date
          description: Ngày hạch toán (dd/MM/yyyy)
        ORIGINAL_AMOUNT:
          type: number
          nullable: true
          description: Số tiền nguyên tệ (null nếu VND)
        BASE_AMOUNT:
          type: number
          description: Số tiền VND (#,##0, căn phải)
        F_STATUS:
          type: string
          description: Trạng thái chứng từ

    # ── Attachment Info ───────────────────────────────────────
    AttachmentInfo:
      type: object
      properties:
        ATTACHMENT_ID:
          type: string
          format: uuid
        FILE_NAME:
          type: string
        ATTACHMENT_TYPE_CODE:
          type: string
          enum: ["Chứng từ gốc", "Hợp đồng", "Hoá đơn", "Bảng kê", "Văn bản khác"]
        FILE_TYPE:
          type: string
          description: "pdf | docx | xlsx | jpg | png"
        FILE_SIZE:
          type: integer
          description: Bytes
        DESCRIPTION:
          type: string
          nullable: true
          maxLength: 250
        CREATED_BY:
          type: string
        CREATED_DATE:
          type: string
          format: date-time

    # ── Audit Log Entry ───────────────────────────────────────
    AuditLogEntry:
      type: object
      properties:
        SEQ_NO:
          type: integer
        ACTION_TYPE:
          type: string
          enum: [INSERT, UPDATE, DELETE, SUBMIT, CHECK, APPROVE, REJECT, CANCEL]
        USER_ID:
          type: string
        ACTION_TIMESTAMP:
          type: string
          format: date-time
        IP_ADDRESS:
          type: string
        OLD_VALUE:
          type: string
          nullable: true
          description: JSON string của giá trị cũ
        NEW_VALUE:
          type: string
          description: JSON string của giá trị mới

    # ── Approval Log Entry ────────────────────────────────────
    ApprovalLogEntry:
      type: object
      properties:
        LOG_ID:
          type: string
          format: uuid
        ACTION_USER:
          type: string
        ACTION_ROLE:
          type: string
          enum: [Maker, Checker, Approver, System]
        ACTION_DATE:
          type: string
          format: date-time
        STATE_CODE:
          type: string
        REASON:
          type: string
          nullable: true

    # ── Workflow Reject Request ───────────────────────────────
    WorkflowRejectRequest:
      type: object
      required: [REASON]
      properties:
        REASON:
          type: string
          minLength: 10
          maxLength: 500
          description: Lý do từ chối (BIZ-006)

    # ── Master Data ───────────────────────────────────────────
    ProjectInfo:
      type: object
      properties:
        PROJECT_CODE:
          type: string
        PROJECT_NAME:
          type: string
        PROJECT_TYPE:
          type: string
          enum: [Military, Citizen]
        PROJECT_SPECIFIC_CODE:
          type: string
          nullable: true
        PROJECT_SPECIFIC_NAME:
          type: string
          nullable: true
        GL_SEGMENT6_CODE:
          type: string
          description: Mã ĐVQHNS (Ban QLDA)
        GL_SEGMENT6_NAME:
          type: string
        PROJECT_SPECIFICS:
          type: array
          items:
            type: object
            properties:
              PROJECT_SPECIFIC_CODE: { type: string }
              PROJECT_SPECIFIC_NAME: { type: string }

    ProjectManagementInfo:
      type: object
      properties:
        PROJECT_MANAGEMENT_CODE:
          type: string
        PROJECT_MANAGEMENT_NAME:
          type: string

    # ── API Error ─────────────────────────────────────────────
    ApiError:
      type: object
      properties:
        ERROR_CODE:
          type: string
          description: Mã lỗi chuẩn VDBAS (VDBAS-VAL-*, VDBAS-EXP-*, VDBAS-SYS-*)
        MESSAGE:
          type: string
          description: Nội dung thông báo lỗi
        TRACE_ID:
          type: string
          description: Trace ID để debug
        FIELD_ERRORS:
          type: array
          description: Chi tiết lỗi từng trường (validate)
          items:
            type: object
            properties:
              FIELD:
                type: string
              MESSAGE:
                type: string
              CODE:
                type: string

  # ─────────────────────────────────────────────────────────
  # RESPONSES (tái sử dụng)
  # ─────────────────────────────────────────────────────────
  responses:

    BadRequest:
      description: Dữ liệu không hợp lệ (validate thất bại)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            required_field:
              summary: Trường bắt buộc bỏ trống (VAL-01)
              value:
                ERROR_CODE: "VDBAS-VAL-0002"
                MESSAGE: "Vui lòng nhập Mã dự án/công trình"
                TRACE_ID: "trace-err-001"
                FIELD_ERRORS:
                  - FIELD: "PROJECT_CODE"
                    MESSAGE: "Vui lòng nhập Mã dự án/công trình"
                    CODE: "VDBAS-VAL-0002"
            format_error:
              summary: Định dạng sai (VAL-02)
              value:
                ERROR_CODE: "VDBAS-VAL-0003"
                MESSAGE: "Định dạng Ngày gửi hồ sơ không hợp lệ"
                TRACE_ID: "trace-err-002"
                FIELD_ERRORS:
                  - FIELD: "SEND_DATE"
                    MESSAGE: "Định dạng Ngày gửi hồ sơ không hợp lệ"
                    CODE: "VDBAS-VAL-0003"
            no_document:
              summary: Chưa có chứng từ khi Submit (BIZ-012)
              value:
                ERROR_CODE: "VDBAS-EXP-0016"
                MESSAGE: "Hồ sơ chưa có chứng từ hợp lệ. Vui lòng thêm chứng từ trước khi gửi kiểm soát."
                TRACE_ID: "trace-err-003"

    NotFound:
      description: Không tìm thấy bản ghi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            ERROR_CODE: "VDBAS-SYS-0404"
            MESSAGE: "Không tìm thấy hồ sơ"
            TRACE_ID: "trace-404-001"

    Forbidden:
      description: Không có quyền thực hiện thao tác (VAL-14)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            no_permission:
              summary: Không có vai trò phù hợp
              value:
                ERROR_CODE: "VDBAS-AUT-0001"
                MESSAGE: "Bạn không có quyền thực hiện thao tác này"
                TRACE_ID: "trace-403-001"
            not_owner:
              summary: Không phải Maker gốc (VAL-14)
              value:
                ERROR_CODE: "VDBAS-EXP-0004"
                MESSAGE: "Chỉ Người lập gốc mới được phép Sửa/Xoá"
                TRACE_ID: "trace-403-002"

    OptimisticLock:
      description: Xung đột phiên bản (Optimistic Lock — VAL-15)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            ERROR_CODE: "VDBAS-EXP-0005"
            MESSAGE: "Bản ghi đã bị thay đổi từ phiên khác. Vui lòng tải lại trước khi tiếp tục."
            TRACE_ID: "trace-409-001"

    DuplicateWarning:
      description: Cảnh báo trùng hồ sơ (VAL-18) — không chặn, chỉ warning
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            ERROR_CODE: "VDBAS-EXP-0011"
            MESSAGE: "Phát hiện hồ sơ tương tự đã được lập gần đây (cùng PROJECT_CODE + PROJECT_MANAGEMENT_CODE). Bạn có muốn tiếp tục?"
            TRACE_ID: "trace-409-002"

    StatusNotAllowed:
      description: Trạng thái không cho phép thao tác (VAL-13)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            edit_not_allowed:
              summary: Không cho phép Sửa khi SUBMITTED
              value:
                ERROR_CODE: "VDBAS-EXP-0003"
                MESSAGE: "Hồ sơ đang ở trạng thái SUBMITTED, không cho phép Sửa/Xoá"
                TRACE_ID: "trace-422-001"
            delete_wrong_reason:
              summary: Lý do xoá không đủ ký tự (VAL-16)
              value:
                ERROR_CODE: "VDBAS-VAL-0011"
                MESSAGE: "Vui lòng nhập lý do (≥ 10 ký tự) và xác nhận đã rà soát"
                TRACE_ID: "trace-422-002"

    InternalServerError:
      description: Lỗi hệ thống
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            ERROR_CODE: "VDBAS-SYS-0001"
            MESSAGE: "Lỗi hệ thống, vui lòng thử lại hoặc liên hệ Quản trị"
            TRACE_ID: "trace-500-001"

  # ─────────────────────────────────────────────────────────
  # EXAMPLES (mock data từ CapexDossierListPage.mock.ts)
