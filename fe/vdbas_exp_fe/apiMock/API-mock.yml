  # MASTER DATA — Projects (LOV.01)
  # ══════════════════════════════════════════════════════════
  /master-data/projects/search:
    post:
      tags: [MasterData]
      summary: Tra cứu Dự án/Công trình (LOV.01)
      description: |
        Popup `EXP.CAPEX_DOSSIER.LOOKUP.PROJECT`. Phím tắt F4.
        Hỗ trợ cascading: khi PROJECT_CODE thay đổi → auto-fill PROJECT_NAME,
        PROJECT_SPECIFIC_CODE, PROJECT_SPECIFIC_NAME, GL_SEGMENT6_CODE.
      operationId: searchProjects
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                PROJECT_CODE:
                  type: string
                PROJECT_NAME:
                  type: string
                PROJECT_TYPE:
                  type: string
                  enum: [Military, Citizen]
                GL_SEGMENT6_CODE:
                  type: string
                PAGE:
                  type: integer
                  default: 0
                SIZE:
                  type: integer
                  default: 20
            example:
              PROJECT_CODE: ""
              PROJECT_NAME: ""
              PAGE: 0
              SIZE: 20
      responses:
        '200':
          description: Danh sách dự án/công trình
          content:
            application/json:
              schema:
                type: object
                properties:
                  CONTENT:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectInfo'
                  TOTAL_ELEMENTS:
                    type: integer
              example:
                CONTENT:
                  - PROJECT_CODE: "7004686"
                    PROJECT_NAME: "Các dự án thuộc dự án bộ quốc phòng"
                    PROJECT_TYPE: "Military"
                    PROJECT_SPECIFIC_CODE: "001200037"
                    PROJECT_SPECIFIC_NAME: "Dự án TM02"
                    GL_SEGMENT6_CODE: "1059227"
                    GL_SEGMENT6_NAME: "BQL Cục thông tin BQP"
                  - PROJECT_CODE: "7004686"
                    PROJECT_NAME: "Các dự án thuộc dự án bộ quốc phòng"
                    PROJECT_TYPE: "Military"
                    PROJECT_SPECIFIC_CODE: "001200038"
                    PROJECT_SPECIFIC_NAME: "Dự án TM03"
                    GL_SEGMENT6_CODE: "1059227"
                    GL_SEGMENT6_NAME: "BQL Cục thông tin BQP"
                  - PROJECT_CODE: "7122155"
                    PROJECT_NAME: "Dự án nâng cấp bệnh viện Bạch Mai"
                    PROJECT_TYPE: "Citizen"
                    PROJECT_SPECIFIC_CODE: null
                    PROJECT_SPECIFIC_NAME: null
                    GL_SEGMENT6_CODE: "3029123"
                    GL_SEGMENT6_NAME: "BQLDA bệnh viện Bạch Mai"
                TOTAL_ELEMENTS: 3

