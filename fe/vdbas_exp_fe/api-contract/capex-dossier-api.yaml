openapi: 3.0.0
info:
  title: CAPEX Dossier Management API
  description: API contract for managing Investment Expenditure (CAPEX) Dossiers in the VDBAS system. Supports Maker-Checker-Approver workflows, document management, and integration with project master data.
  version: 1.0.0
  contact:
    name: Gemini CLI
    email: support@example.com

servers:
  - url: /api/v1
    description: VDBAS API Gateway

tags:
  - name: Dossier
    description: CRUD and workflow operations for CAPEX Dossiers
  - name: Document
    description: Operations for documents attached to a dossier
  - name: Attachment
    description: Upload and manage file attachments for a dossier
  - name: MasterData
    description: Reference data for lookups (Projects, Users, etc.)

paths:
  /capex-dossier:
    get:
      tags: [Dossier]
      summary: Search dossiers
      description: Returns a paginated list of dossiers based on filters.
      parameters:
        - name: dossierCode
          in: query
          schema: { type: string }
          description: Filter by dossier code (contains)
        - name: projectCode
          in: query
          schema: { type: string }
          description: Filter by project code (contains)
        - name: stateCode
          in: query
          schema: { type: string }
          description: "Filter by status (DRAFT, PENDING_CHECK, CHECK_REJECTED, CHECK_CANCELLED, PENDING_APPROVE, APPROVE_REJECTED, APPROVE_CANCELLED, APPROVED)"
        - name: dataSourceCode
          in: query
          schema: { type: string, enum: ['Thủ công', DVC, 'Chuyển đổi'] }
          description: Filter by data source
        - name: createdBy
          in: query
          schema: { type: string }
          description: Filter by creator username (contains)
        - name: checkedBy
          in: query
          schema: { type: string }
          description: Filter by checker username (contains)
        - name: approvedBy
          in: query
          schema: { type: string }
          description: Filter by approver username (contains)
        - name: dateType
          in: query
          schema: { type: string, enum: [SEND_DATE, CREATED_DATE, CHECKED_DATE, APPROVED_DATE], default: SEND_DATE }
          description: Which date field fromDate/toDate applies to
        - name: fromDate
          in: query
          schema: { type: string, format: date }
          description: Range start date (applies to dateType field)
        - name: toDate
          in: query
          schema: { type: string, format: date }
          description: Range end date (applies to dateType field)
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: sortField
          in: query
          schema: { type: string, default: CREATED_DATE }
          description: "Field to sort by (DOSSIER_CODE, SEND_DATE, STATE_CODE, CREATED_BY, CREATED_DATE, CHECKED_DATE, APPROVED_DATE, TOTAL_VND)"
        - name: sortDir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: { $ref: '#/components/schemas/DossierSummary' }
                  totalElements: { type: integer }
                  totalPages: { type: integer }

    post:
      tags: [Dossier]
      summary: Create new dossier
      description: Initializes a new dossier in DRAFT status.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DossierCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierHeader' }

  /capex-dossier/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Dossier]
      summary: Get dossier detail
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [Dossier]
      summary: Update dossier
      description: Update header information of a dossier (only in DRAFT status).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DossierUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierHeader' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

    delete:
      tags: [Dossier]
      summary: Soft delete dossier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deleteReason, confirmReviewed]
              properties:
                deleteReason: { type: string, minLength: 10, maxLength: 500 }
                confirmReviewed: { type: boolean }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }

  /capex-dossier/{id}/submit:
    post:
      tags: [Dossier]
      summary: Submit for check
      description: Transitions dossier from DRAFT to PENDING_CHECK.
      responses:
        '200': { description: Submitted }
        '400': { $ref: '#/components/responses/BadRequest' }

  /capex-dossier/{id}/workflow:
    post:
      tags: [Dossier]
      summary: Workflow action (Check/Approve/Reject)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowActionRequest' }
      responses:
        '200': { description: Action applied }
        '400': { $ref: '#/components/responses/BadRequest' }

  /capex-dossier/{id}/documents:
    get:
      tags: [Document]
      summary: List documents in dossier
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentDetail' }

  /capex-dossier/{id}/attachments:
    get:
      tags: [Attachment]
      summary: List attachments of a dossier
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttachmentInfo' }
    post:
      tags: [Attachment]
      summary: Upload attachment
      description: Upload a file attachment (≤10MB, pdf/jpg/png/docx).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, archiveType]
              properties:
                file:
                  type: string
                  format: binary
                archiveType:
                  type: string
                  enum: [ORIGINAL, CONTRACT, INVOICE, STATEMENT, OTHER]
                description:
                  type: string
                  maxLength: 250
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /capex-dossier/{id}/attachments/{attachmentId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Attachment]
      summary: Delete attachment
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /capex-dossier/export:
    get:
      tags: [Dossier]
      summary: Export dossier list
      description: >
        Export filtered dossiers. If result count ≤ 50,000 returns file directly;
        otherwise triggers async job and sends email notification.
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [xlsx, pdf, csv] }
        - name: dossierCode
          in: query
          schema: { type: string }
        - name: stateCode
          in: query
          schema: { type: string }
        - name: dataSourceCode
          in: query
          schema: { type: string }
        - name: createdBy
          in: query
          schema: { type: string }
        - name: checkedBy
          in: query
          schema: { type: string }
        - name: approvedBy
          in: query
          schema: { type: string }
        - name: dateType
          in: query
          schema: { type: string, enum: [SEND_DATE, CREATED_DATE, CHECKED_DATE, APPROVED_DATE] }
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: File download (sync, ≤50,000 records)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '202':
          description: Async export accepted — email notification will be sent on completion
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string }
                  message: { type: string }

  /master-data/projects:
    get:
      tags: [MasterData]
      summary: Search projects (LOV.01)
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: name
          in: query
          schema: { type: string }
        - name: projectTypeCode
          in: query
          schema: { type: string, enum: [Military, Citizen] }
        - name: projectManagementCode
          in: query
          schema: { type: string }
          description: Filter by GL_SEGMENT6_CODE
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectInfo' }

  /master-data/users:
    get:
      tags: [MasterData]
      summary: Search users (LOV.USER)
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
          description: Search by username or fullname (contains)
        - name: role
          in: query
          schema: { type: string, enum: [Maker, Checker, Approver] }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserInfo' }

components:
  schemas:
    DossierHeader:
      type: object
      properties:
        dossierId: { type: string, format: uuid }
        dossierCode: { type: string }
        sendDate: { type: string, format: date }
        stateCode: { type: string, enum: [DRAFT, PENDING_CHECK, CHECK_REJECTED, CHECK_CANCELLED, PENDING_APPROVE, APPROVE_REJECTED, APPROVE_CANCELLED, APPROVED, DELETED] }
        projectCode: { type: string }
        projectName: { type: string }
        projectSpecificCode: { type: string, nullable: true }
        projectSpecificName: { type: string, nullable: true }
        projectManagementCode: { type: string }
        projectManagementName: { type: string }
        dataSourceCode: { type: string, enum: ['Thủ công', DVC, 'Chuyển đổi'] }
        createdBy: { type: string }
        createdDate: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedDate: { type: string, format: date-time }
        checkedBy: { type: string, nullable: true }
        checkedDate: { type: string, format: date-time, nullable: true }
        approvedBy: { type: string, nullable: true }
        approvedDate: { type: string, format: date-time, nullable: true }
        checkRejectionReason: { type: string, nullable: true }
        approvalRejectionReason: { type: string, nullable: true }
        returningReason: { type: string, nullable: true, description: "Lý do từ chối tiếp nhận" }
        version: { type: integer, description: "Optimistic locking version (F-VER)" }

    DossierSummary:
      type: object
      properties:
        dossierId: { type: string, format: uuid }
        dossierCode: { type: string }
        sendDate: { type: string, format: date }
        stateCode: { type: string }
        projectCode: { type: string }
        projectName: { type: string }
        dataSourceCode: { type: string }
        createdBy: { type: string }
        createdDate: { type: string, format: date-time }
        checkedBy: { type: string, nullable: true }
        checkedDate: { type: string, format: date-time, nullable: true }
        approvedBy: { type: string, nullable: true }
        approvedDate: { type: string, format: date-time, nullable: true }
        checkRejectionReason: { type: string, nullable: true }
        approvalRejectionReason: { type: string, nullable: true }
        returningReason: { type: string, nullable: true, description: "Lý do từ chối tiếp nhận" }
        totalAmountVnd: { type: number }
        documentCount: { type: integer }

    DossierCreateRequest:
      type: object
      required: [projectCode, projectManagementCode, sendDate]
      properties:
        sendDate: { type: string, format: date }
        projectCode: { type: string }
        projectSpecificCode: { type: string, nullable: true }
        projectManagementCode: { type: string }
        dataSourceCode: { type: string, enum: ['Thủ công', DVC, 'Chuyển đổi'], default: 'Thủ công' }

    DossierUpdateRequest:
      type: object
      properties:
        sendDate: { type: string, format: date }
        projectCode: { type: string }
        projectSpecificCode: { type: string }
        projectManagementCode: { type: string }
        version: { type: integer, required: true }

    DossierDetail:
      allOf:
        - $ref: '#/components/schemas/DossierHeader'
        - type: object
          properties:
            documents:
              type: array
              items: { $ref: '#/components/schemas/DocumentDetail' }
            attachments:
              type: array
              items: { $ref: '#/components/schemas/AttachmentInfo' }
            approvalHistory:
              type: array
              items: { $ref: '#/components/schemas/ApprovalLogEntry' }

    DocumentDetail:
      type: object
      description: "Maps to EXP_DOCUMENT table"
      properties:
        documentId: { type: string, format: uuid, description: "DOCUMENT_ID" }
        documentNumber: { type: string, description: "DOCUMENT_NUMBER" }
        documentDate: { type: string, format: date, description: "DOCUMENT_DATE" }
        accountingDate: { type: string, format: date, description: "ACCOUNTING_DATE" }
        documentTemplateId: { type: integer, format: int64, description: "DOCUMENT_TEMPLATE_ID" }
        documentTypeCode: { type: string, description: "DOCUMENT_TYPE_CODE" }
        fiscalYear: { type: integer, description: "FISCAL_YEAR - Niên độ" }
        paymentRequestNo: { type: string, nullable: true, description: "PAYMENT_REQUEST_NO" }
        paymentRequestDate: { type: string, format: date, nullable: true, description: "PAYMENT_REQUEST_DATE" }
        treasuryCode: { type: string, description: "TREASURY_CODE" }
        payingTreasuryCode: { type: string, nullable: true, description: "PAYING_TREASURY_CODE" }
        paymentTypeCode: { type: string, description: "PAYMENT_TYPE_CODE - Tạm ứng/Thanh toán" }
        capitalPlanTypeCode: { type: string, description: "CAPITAL_PLAN_TYPE_CODE" }
        currencyTypeCode: { type: string, description: "CURRENCY_TYPE_CODE" }
        exchangeRateTypeCode: { type: string, description: "EXCHANGE_RATE_TYPE_CODE" }
        exchangeRateDate: { type: string, format: date, nullable: true, description: "EXCHANGE_RATE_DATE" }
        exchangeRate: { type: number, nullable: true, description: "EXCHANGE_RATE" }
        projectItemCode: { type: string, description: "PROJECT_ITEM_CODE" }
        projectItemName: { type: string, nullable: true, description: "PROJECT_ITEM_NAME" }
        domesticAccount: { type: string, nullable: true, description: "DOMESTIC_ACCOUNT" }
        domesticBank: { type: string, nullable: true, description: "DOMESTIC_BANK" }
        foreignAccount: { type: string, nullable: true, description: "FOREIGN_ACCOUNT" }
        foreignBank: { type: string, nullable: true, description: "FOREIGN_BANK" }
        guaranteeId: { type: integer, format: int64, description: "GUARANTEE_ID" }
        guaranteeNo: { type: string, nullable: true, description: "GUARANTEE_NO" }
        guaranteeAmount: { type: number, nullable: true, description: "GUARANTEE_AMOUNT" }
        guaranteeRemainAmount: { type: number, nullable: true, description: "GUARANTEE_REMAIN_AMOUNT" }
        guaranteeExpiryDate: { type: string, format: date, nullable: true, description: "GUARANTEE_EXPIRY_DATE" }
        guaranteeRevokedDate: { type: string, format: date, nullable: true, description: "GUARANTEE_REVOKED_DATE" }
        completedWorkloadNo: { type: integer, nullable: true, description: "COMPLETED_WORKLOAD_NO" }
        completedWorkloadDate: { type: string, format: date, nullable: true, description: "COMPLETED_WORKLOAD_DATE" }
        cumulativeWorkloadPayment: { type: number, nullable: true, description: "CUMULATIVE_WORKLOAD_PAYMENT" }
        cumulativePaidCapital: { type: number, nullable: true, description: "CUMULATIVE_PAID_CAPITAL" }
        advancePaymentAmount: { type: number, nullable: true, description: "ADVANCE_PAYMENT_AMOUNT - Số dư tạm ứng" }
        lines:
          type: array
          items: { $ref: '#/components/schemas/DocumentLine' }

    DocumentLine:
      type: object
      description: "Maps to EXP_DOCUMENT_LINE table"
      properties:
        documentLineId: { type: string, format: uuid, description: "DOCUMENT_LINE_ID" }
        capitalYear: { type: integer, description: "CAPITAL_YEAR - Năm kế hoạch" }
        extended: { type: integer, enum: [1, 2], nullable: true, description: "EXTENDED: 1-Kéo dài, 2-Không kéo dài" }
        investmentSourceCode: { type: string, description: "INVESTMENT_SOURCE_CODE" }
        allocationCriteriaCode: { type: string, description: "ALLOCATION_CRITERIA_CODE" }
        paymentRequestAmount: { type: number, nullable: true, description: "PAYMENT_REQUEST_AMOUNT - Số ĐNTT NT" }
        paymentRequestAmountVnd: { type: number, nullable: true, description: "PAYMENT_REQUEST_AMOUNT_VND - Số ĐNTT VND" }
        approvedAmount: { type: number, nullable: true, description: "APPROVED_AMOUNT - Số KBNN duyệt NT" }
        approvedAmountVnd: { type: number, nullable: true, description: "APPROVED_AMOUNT_VND - Số KBNN duyệt VND" }
        advanceDeductionAmount: { type: number, nullable: true, description: "ADVANCE_DEDUCTION_AMOUNT - Thu hồi tạm ứng NT" }
        advanceDeductionAmountVnd: { type: number, nullable: true, description: "ADVANCE_DEDUCTION_AMOUNT_VND - Thu hồi tạm ứng VND" }
        warrantyAmount: { type: number, nullable: true, description: "WARRANTY_AMOUNT - Chuyển bảo hành NT" }
        warrantyAmountVnd: { type: number, nullable: true, description: "WARRANTY_AMOUNT_VND - Chuyển bảo hành VND" }
        pendingSettlementAmount: { type: number, nullable: true, description: "PENDING_SETTLEMENT_AMOUNT - Tạm giữ chờ quyết toán NT" }
        pendingSettlementAmountVnd: { type: number, nullable: true, description: "PENDING_SETTLEMENT_AMOUNT_VND - Tạm giữ chờ quyết toán VND" }
        valueAddedTaxAmount: { type: number, nullable: true, description: "VALUE_ADDED_TAX_AMOUNT - Thuế GTGT" }
        transferBeneficiaryAmount: { type: number, nullable: true, description: "TRANSFER_BENEFICIARY_AMOUNT - Chuyển đơn vị thụ hưởng NT" }
        transferBeneficiaryAmountVn: { type: number, nullable: true, description: "TRANSFER_BENEFICIARY_AMOUNT_VN - Chuyển đơn vị thụ hưởng VND" }
        beneficiaryName: { type: string, nullable: true, description: "BENEFICIARY_NAME" }
        beneficiaryAccount: { type: string, nullable: true, description: "BENEFICIARY_ACCOUNT" }
        beneficiaryBankName: { type: string, nullable: true, description: "BENEFICIARY_BANK_NAME" }
        beneficiaryBankCode: { type: string, description: "BENEFICIARY_BANK_CODE" }
        glSegments:
          type: object
          description: "GL Segments — chỉ các segment có trong EXP_DOCUMENT_LINE"
          properties:
            segment2: { type: string, description: "GL_SEGMENT2 - TKTN" }
            segment4: { type: string, description: "GL_SEGMENT4 - NDKT" }
            segment5: { type: string, description: "GL_SEGMENT5 - Cấp NS" }
            segment8: { type: string, description: "GL_SEGMENT8 - Chương" }
            segment9: { type: string, description: "GL_SEGMENT9 - Ngành" }
            segment10: { type: string, description: "GL_SEGMENT10 - CTMT" }
            segment12: { type: string, description: "GL_SEGMENT12 - Nguồn" }
            segment13: { type: string, description: "GL_SEGMENT13 - DP" }

    AttachmentInfo:
      type: object
      description: "Maps to EXP_ARCHIVE table"
      properties:
        archiveId: { type: string, format: uuid, description: "ARCHIVE_ID" }
        fileName: { type: string, description: "FILE_NAME" }
        archiveType: { type: string, description: "ARCHIVE_TYPE - Loại lưu trữ" }
        description: { type: string, nullable: true, description: "DESCRIPTION - Mô tả" }
        archiveDate: { type: string, format: date, nullable: true, description: "ARCHIVE_DATE" }
        createdBy: { type: string, description: "CREATED_BY" }
        createdDate: { type: string, format: date-time, description: "CREATED_DATE" }
        updatedBy: { type: string, nullable: true, description: "UPDATED_BY" }
        updatedDate: { type: string, format: date-time, nullable: true, description: "UPDATED_DATE" }

    ApprovalLogEntry:
      type: object
      properties:
        logId: { type: string, format: uuid }
        actionUser: { type: string }
        actionDate: { type: string, format: date-time }
        actionRole: { type: string }
        stateCode: { type: string }
        reason: { type: string }

    WorkflowActionRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [CHECK, APPROVE, REJECT, RETURN] }
        reason: { type: string, minLength: 10, description: "Required for REJECT and RETURN" }

    ProjectInfo:
      type: object
      description: "Maps to EXP_PROJECT joined with EXP_PROJECT_MANAGEMENT"
      properties:
        projectCode: { type: string, description: "EXP_PROJECT.PROJECT_CODE" }
        projectName: { type: string, description: "EXP_PROJECT.PROJECT_NAME" }
        projectTypeCode: { type: string, enum: [Military, Citizen], description: "EXP_PROJECT.PROJECT_TYPE_CODE" }
        projectSpecificCode: { type: string, nullable: true, description: "Mã dự án đặc thù (Military only)" }
        projectSpecificName: { type: string, nullable: true, description: "Tên dự án đặc thù (Military only)" }
        projectManagementCode: { type: string, description: "EXP_PROJECT.PROJECT_MANAGEMENT_CODE = GL_SEGMENT6_CODE" }
        projectManagementName: { type: string, description: "EXP_PROJECT_MANAGEMENT.PROJECT_MANAGEMENT_NAME (via JOIN)" }

    UserInfo:
      type: object
      description: "User lookup for Maker/Checker/Approver LOV"
      properties:
        username: { type: string }
        fullname: { type: string }
        role: { type: string, enum: [Maker, Checker, Approver] }
        unit: { type: string, description: "Đơn vị/phòng ban" }

    ApiError:
      type: object
      properties:
        errorCode: { type: string }
        message: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Optimistic lock conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InternalServerError:
      description: System error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
