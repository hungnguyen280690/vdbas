version: '3.8'

services:
  vdbas-exp-fe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8083/api
        - VITE_ACL_API_BASE_URL=http://localhost:8082/api
        - VITE_APP_NAME=VDBAS exp (Dev)
        - VITE_APP_VERSION=1.0.0
        - VITE_APP_CODE=EXP
    image: vdbas-exp-fe:latest
    container_name: vdbas-exp-fe
    restart: unless-stopped
    ports:
      - "3003:80"
    networks:
      - exp-network

networks:
  exp-network:
    driver: bridge
